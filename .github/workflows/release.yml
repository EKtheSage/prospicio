name: Release

# Publishes a release to PyPI and crates.io when a version tag is pushed
# (`git tag v0.0.1 && git push origin v0.0.1`). Run by hand
# (workflow_dispatch) or on its weekly schedule, it builds and tests the
# wheels and the crates but publishes nothing: a dry run. The steps, and the one-time
# registry setup, are in docs/release.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # A weekly dry run (#828): the wheels on Linux x86_64 and aarch64, macOS
  # and Windows, each tested, the sdist, the crates and semver, so a failure
  # on a platform CI's pull requests do not build shows before a release.
  # The publish jobs run only on a tag, so a scheduled run publishes nothing.
  schedule:
    - cron: "41 3 * * 0"

permissions:
  contents: read

jobs:
  # The tag must name the version in Cargo.toml (workspace.package), which
  # every crate and the Python package take theirs from, and the R
  # package's DESCRIPTION must hold the same version (#827).
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag and the R package against the workspace version
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "Workspace version: $version"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$version" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match the workspace version v$version"
            exit 1
          fi
          r_version=$(sed -n 's/^Version: *//p' R/prospicio/DESCRIPTION)
          echo "R package version: $r_version"
          if [ "$r_version" != "$version" ]; then
            echo "::error::R/prospicio/DESCRIPTION has Version $r_version, the workspace $version"
            exit 1
          fi

  # One abi3 wheel per platform serves every Python from 3.9. Each wheel is
  # installed and the Python test suite run against it on its own platform.
  wheels:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64 }
          - { os: macos-latest, target: universal2-apple-darwin }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The dependencies' builds, kept between the dry run and the tag's run
      # (#827); a manylinux build runs in a container and reuses less of it.
      - uses: Swatinem/rust-cache@v2
        with:
          key: wheels-${{ matrix.target }}
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      # LightGBM's macOS wheel links OpenMP from Homebrew.
      - if: runner.os == 'macOS'
        run: brew install libomp
      - name: Test the wheel
        shell: bash
        working-directory: python
        run: |
          uv venv .venv-wheel
          source .venv-wheel/bin/activate 2>/dev/null || source .venv-wheel/Scripts/activate
          uv pip install --group dev
          uv pip install prospicio --no-index --find-links dist
          # As ci.yml's python job splits the suite (#848, #966): the light
          # files on four workers with one rayon thread each, then the
          # NUTS-heavy files, the boosting tests, the guides and the
          # notebooks one at a time with every thread. A heavy file missing
          # from this list still runs, only slower, in the first batch.
          alone="tests/test_reserving_compartmental.py
            tests/test_reserving_hierarchical_bf.py
            tests/test_reserving_compartmental_backtest.py
            tests/test_reserving_compartmental_segments.py
            tests/test_reserving_compartmental_one_year_segments.py
            tests/test_reserving_pattern_draws.py
            tests/test_boosting.py
            tests/test_guides.py
            tests/test_examples.py"
          ignore=""
          for f in $alone; do ignore="$ignore --ignore=$f"; done
          RAYON_NUM_THREADS=1 pytest tests -n 4 --dist loadfile $ignore --durations=25 --durations-min=5
          pytest $alone --durations=25 --durations-min=5
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: python/dist

  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist

  # Packages every publishable crate and builds each from its package, the
  # way crates.io will see it.
  crates:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --workspace --dry-run

  # The public API of every publishable crate against its last version on
  # crates.io (#573). A 0.0.x version may break anything under Cargo's
  # rules, so the check is run as for a minor release, which reports every
  # break: a removed item, a changed signature, a new required trait item.
  # Until 1.0 it reports and does not block (each break it lists needs a
  # changelog fragment marked breaking, docs/release.md); from 1.0 it
  # drops continue-on-error and the publish jobs need it.
  semver:
    needs: version
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - run: cargo semver-checks check-release --workspace --release-type minor

  pypi:
    if: github.ref_type == 'tag'
    needs: [wheels, sdist, crates]
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI accepts this repository, workflow and
    # environment (docs/release.md); no token is stored.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  crates-io:
    if: github.ref_type == 'tag'
    needs: [wheels, sdist, crates]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Trusted publishing: crates.io accepts this repository, workflow and
      # environment for each crate (docs/release.md) and hands out a
      # short-lived token; no token is stored. A new crate has to be
      # published once by hand before it can be added.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # Publishes the crates in dependency order, waiting for each to be
      # indexed before the crates that need it.
      - run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Reports a scheduled run that failed (#936): opens an issue titled
  # "Weekly release dry run is red", or adds a comment to it when it is already open, and closes
  # it when a scheduled run passes. It runs only on the schedule, whatever
  # the other jobs did, and never fails the run itself (continue-on-error).
  report:
    needs: [version, wheels, sdist, crates, semver, pypi, crates-io]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: "Weekly release dry run is red"
      RESULTS: ${{ toJSON(needs) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Open, update or close the issue
        shell: bash
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key' <<< "$RESULTS")
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq 'map(select(.title == env.TITLE)) | first | .number // empty')
          if [ -z "$failed" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "The scheduled run passed: $RUN_URL"
            fi
            exit 0
          fi
          jobs=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | "- [\(.name)](\(.html_url))"' || true)
          [ -n "$jobs" ] || jobs=$(sed 's/^/- /' <<< "$failed")
          body=$(printf 'A scheduled run failed: %s\n\nFailed jobs:\n\n%s\n' "$RUN_URL" "$jobs")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
