name: CI

# Wait: the repository is public, so its minutes are not billed; the limits
# below keep a pull request's wait short (#828). Pull requests run Ubuntu
# only; the full matrix with Windows runs nightly and on demand, so a
# Windows failure shows within a day (macOS and aarch64 are built by
# release.yml, whose dry run is nightly). A pull request runs the python and r jobs unless it touches only
# docs, knowledge, change fragments or lane status (DOCS_ONLY below), and
# the jobs that run a slow suite in a release build (bayes, fremtpl2) and
# cargo deny (deny) only when it touches their inputs. A push to main runs the Rust job's checks
# and, in every other job but docs, only builds what that job's cache is
# missing (the cache's key changes with Cargo.lock and the toolchain), so
# that pull requests, which can read main's caches but not each other's,
# start warm; the Pages build (pages.yml) keeps the docs job's cache warm
# the same way. Tests that sample with NUTS stay out of the rust job's
# debug tests: the Bayesian parity files sit behind prospicio-validation's
# `slow-bayes`, and prospicio-reserving's NUTS unit tests are ignored
# without its `slow-tests`. Of the slowest Bayesian checks, the one-year
# conformance suite and Meyers' and the compartmental models' one-year
# views, a PR runs a smoke version (the conformance suite on BayesOdp and
# BayesBf; Meyers' CRC; compartmental model 1 without its refit
# comparison); the nightly and manual runs set RISK_RS_FULL_BAYES and run
# them all.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly (#828): the full matrix, Windows included.
    - cron: "17 6 * * *"
  workflow_dispatch:

# A new push to a pull request's branch cancels that branch's run still in
# progress. Pushes to main, the nightly run and manual runs each get a group
# of their own, so a merge never cancels the nightly run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Paths a pull request can change without running the python and r jobs:
  # nothing in them is built or read by the bindings' tests (the guides in
  # docs/guides and the notebooks in examples/ are).
  DOCS_ONLY: '^(knowledge/|changes/|docs/(lanes|design)/|docs/[^/]+\.md$|[^/]+\.md$|crates/prospicio-xll/|xtask/|\.github/workflows/(xll|release|pages)\.yml$|validation/scripts/(check_okf|check_lanes|test_check_lanes|check_bindings|test_check_bindings|fold_changes|bayes_shards)\.py$|validation/bindings-allowlist\.toml$|deny\.toml$)'

jobs:
  # The checks every pull request needs, a few seconds in all (#827): the
  # formatting, the knowledge bundle, the change fragments, the lane status
  # files and the bindings' coverage. They run whatever the PR touches.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      # The knowledge bundle conforms to OKF v0.2 (knowledge/index.md).
      - run: python3 -m pip install --quiet pyyaml && python3 validation/scripts/check_okf.py knowledge
      # Change fragments (changes/README.md) are valid and fold cleanly.
      - run: python3 validation/scripts/fold_changes.py --self-test && python3 validation/scripts/fold_changes.py --check
      # Lane status files (docs/lanes/*.md) have ids and no resurrected bullets.
      - run: python3 validation/scripts/test_check_lanes.py && python3 validation/scripts/check_lanes.py
      # Public Rust items are bound in Python and R or on the allow-list
      # (validation/bindings-allowlist.toml); prints the coverage table.
      - run: python3 validation/scripts/test_check_bindings.py && python3 validation/scripts/check_bindings.py
      # Every slow Bayesian target is in one leg of the bayes job, and every
      # leg is one its matrix runs (#824).
      - run: python3 validation/scripts/bayes_shards.py

  # Clippy, the debug tests, rustdoc and the WASM check. A pull request that
  # touches only docs, knowledge, change fragments or lane status skips them
  # (DOCS_ONLY, except the Excel add-in and xtask, which are Rust; #827).
  rust:
    runs-on: ubuntu-latest
    # Line tables only in the test binaries (#851): panics still name the
    # file and line, and there is less debug information to write and link.
    # Local builds keep full debug information (Cargo.toml's dev profile).
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether any Rust input changed
        id: changes
        shell: bash
        run: |
          rust_free="${DOCS_ONLY//crates\/prospicio-xll\/|/}"
          rust_free="${rust_free//xtask\/|/}"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qvE "$rust_free"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Only docs, knowledge, change fragments or lane status changed; skipping the Rust checks."
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - if: steps.changes.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
      # Default members: pure-Rust crates and the parity suite. The feature
      # lints the Bayesian parity tests too, and turns on
      # prospicio-reserving/slow-tests; `cargo test` skips the parity files
      # and ignores the NUTS unit tests (the bayes job runs both in
      # release). The dev profile is optimized (Cargo.toml), which took the
      # debug tests from about 7 minutes to about 1.
      - if: steps.changes.outputs.run == 'true'
        run: cargo clippy --all-targets --features prospicio-validation/slow-bayes -- -D warnings
      - if: steps.changes.outputs.run == 'true'
        run: cargo test
      # Rustdoc with warnings denied, as the docs job runs it (cargo xtask rust),
      # but on every PR: a crate-only PR does not trigger the docs job.
      - if: steps.changes.outputs.run == 'true'
        run: cargo xtask rust
      # The crates in the WASM scope (docs/architecture.md, "Open
      # decisions") build for the browser.
      - if: steps.changes.outputs.run == 'true'
        run: cargo check --target wasm32-unknown-unknown -p prospicio-core -p prospicio-math -p prospicio-prob -p prospicio-aggregate -p prospicio-pricing -p prospicio-reserving -p prospicio

  # The workspace builds on the rust-version it declares (Cargo.toml,
  # 1.92), so the manifest cannot drift from the code again (#829). The R
  # bindings need R installed, so they are checked by the r job instead.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether any Rust input changed
        id: changes
        shell: bash
        run: |
          rust_free="${DOCS_ONLY//crates\/prospicio-xll\/|/}"
          rust_free="${rust_free//xtask\/|/}"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qvE "$rust_free"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.changes.outputs.version }}
      - if: steps.changes.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - if: steps.changes.outputs.run == 'true'
        run: cargo check --workspace --exclude prospicio-r --all-targets --features prospicio-validation/slow-bayes,prospicio-reserving/io,prospicio-prob/arrow

  # Two legs (#850): `tests`, the binding tests on four workers (#848), and
  # `guides`, the guides and notebooks one at a time, since each guide must
  # finish within 30 s (test_guides.py) and so must not share the cores.
  # Each leg builds the package itself; on a push to main only the tests
  # leg builds, to fill the cache both legs read.
  python:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
        part: [tests, guides]
        # TEMPORARY (measuring #848/#849): one rayon thread against the default.
        rayon: ["1", "0"]
        exclude:
          - part: guides
            rayon: "1"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether the bindings' inputs changed
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qvE "$DOCS_ONLY"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Only docs, knowledge, change fragments or lane status changed; skipping the Python tests."
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # On a push to main, build only if the restore was not an exact match
      # (the post step then saves the cache).
      - if: steps.changes.outputs.run == 'true'
        id: cache
        uses: Swatinem/rust-cache@v2
      - name: Plan
        id: plan
        run: |
          run=${{ steps.changes.outputs.run }}
          push=${{ github.event_name == 'push' }}
          hit=${{ steps.cache.outputs.cache-hit == 'true' }}
          tests=${{ matrix.part == 'tests' }}
          echo "build=$([ "$run" = true ] && ! { [ "$push" = true ] && { [ "$hit" = true ] || [ "$tests" = false ]; }; } && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "test=$([ "$run" = true ] && [ "$push" = false ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.build == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.plan.outputs.build == 'true' && matrix.part == 'tests'
        run: cargo clippy -p prospicio-python -- -D warnings
      - if: steps.plan.outputs.build == 'true'
        run: uv sync
        working-directory: python
      # Four workers (pytest-xdist), each test file on one worker so its
      # module fixtures load once (#848). One rayon thread per worker, so
      # four workers do not start sixteen threads on four cores; no result
      # depends on the thread count (one RNG stream per simulation). The
      # slowest tests' times in the log, so a slowdown can be traced to them
      # (#826).
      - if: steps.plan.outputs.test == 'true' && matrix.part == 'tests'
        name: Run the binding tests on four workers
        env:
          RAYON_NUM_THREADS: ${{ matrix.rayon }}
        run: |
          uv run pytest tests -n 4 --dist loadfile \
            --ignore=tests/test_guides.py --ignore=tests/test_examples.py --ignore=tests/test_boosting.py \
            --durations=25 --durations-min=5
          uv run pytest tests/test_boosting.py --durations=10 --durations-min=5
        working-directory: python
      - if: steps.plan.outputs.test == 'true' && matrix.part == 'guides'
        name: Run the guides and notebooks
        run: uv run pytest tests/test_guides.py tests/test_examples.py --durations=25 --durations-min=5
        working-directory: python

  # The same two legs as the python job (#850): `tests`, every file but
  # the guides, four at a time (#849), and `guides`, tests/test-guides.R.
  r:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
        part: [tests, guides]
        # TEMPORARY (measuring #848/#849): one rayon thread against the default.
        rayon: ["1", "0"]
        exclude:
          - part: guides
            rayon: "1"
    runs-on: ${{ matrix.os }}
    # PowerShell (the Windows default) aliases `R` to Invoke-History.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether the bindings' inputs changed
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qvE "$DOCS_ONLY"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Only docs, knowledge, change fragments or lane status changed; skipping the R tests."
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.os == 'windows-latest' && 'x86_64-pc-windows-gnu' || '' }}
      # On a push to main, build only if the restore was not an exact match
      # (the post step then saves the cache).
      - if: steps.changes.outputs.run == 'true'
        id: cache
        uses: Swatinem/rust-cache@v2
      - name: Plan
        id: plan
        run: |
          run=${{ steps.changes.outputs.run }}
          push=${{ github.event_name == 'push' }}
          hit=${{ steps.cache.outputs.cache-hit == 'true' }}
          tests=${{ matrix.part == 'tests' }}
          echo "build=$([ "$run" = true ] && ! { [ "$push" = true ] && { [ "$hit" = true ] || [ "$tests" = false ]; }; } && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "test=$([ "$run" = true ] && [ "$push" = false ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.build == 'true'
        uses: r-lib/actions/setup-r@v2  # installs Rtools on Windows
        with:
          # Binary packages: lightgbm and xgboost take minutes to compile.
          use-public-rspm: true
      - if: steps.plan.outputs.build == 'true' && matrix.part == 'tests'
        run: cargo clippy -p prospicio-r -- -D warnings
      # lightgbm and xgboost are optional engines for booster_fit(). The
      # boosting tests skip a missing engine and install.packages() only
      # warns on failure, so check that each one loads. ggplot2 and gt draw
      # the R guides' figures and tables, which tests/test-guides.R runs. On
      # Windows R starts with no CRAN mirror set, so fall back to the cloud
      # mirror when none is; Ubuntu keeps setup-r's RSPM binaries.
      - if: steps.plan.outputs.build == 'true'
        run: >-
          Rscript -e "r <- getOption('repos'); if (is.null(r) || r['CRAN'] %in% c('@CRAN@', NA)) { r['CRAN'] <- 'https://cloud.r-project.org'; options(repos = r) };
          pkgs <- c('S7', 'lightgbm', 'xgboost', 'ggplot2', 'gt'); install.packages(pkgs);
          for (p in pkgs) if (!requireNamespace(p, quietly = TRUE)) stop(p, ' did not install')"
      - if: steps.plan.outputs.build == 'true'
        run: R CMD INSTALL R/prospicio
      # validation/scripts/run_r_tests.py runs every file, prints each one's
      # time and result as it finishes (#826), and the log of every failed
      # file at the end (#845). The slowest files start first, so the
      # longest does not start last.
      - name: Run the R tests four at a time
        if: steps.plan.outputs.test == 'true' && matrix.part == 'tests'
        env:
          RAYON_NUM_THREADS: ${{ matrix.rayon }}
        run: >-
          "$([ "$RUNNER_OS" = Windows ] && echo python || echo python3)" validation/scripts/run_r_tests.py --jobs 4
          --exclude test-guides.R --last test-boosting.R
          --first test-reserving-compartmental.R
          --first test-reserving-compartmental-segments.R
          --first test-reserving-pattern-draws.R
      - name: Run the R guides
        if: steps.plan.outputs.test == 'true' && matrix.part == 'guides'
        run: >-
          "$([ "$RUNNER_OS" = Windows ] && echo python || echo python3)" validation/scripts/run_r_tests.py --jobs 1 test-guides.R
      # remotes::install_github(subdir = "R/prospicio") and r-universe build
      # a tarball of R/prospicio alone, which carries its Rust sources only
      # because pkgbuild runs bootstrap.R first. Install from such a tarball,
      # into a library of its own, and run one test file against it: the
      # full suite already ran on the checkout's install. It compiles the
      # crates again (a few minutes), so a PR runs it only when the
      # package's build inputs change; the nightly run always does.
      - name: Check whether the R build inputs changed
        id: rbuild
        if: steps.plan.outputs.test == 'true' && matrix.part == 'tests'
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -qE '^(R/prospicio/(bootstrap\.R|DESCRIPTION|\.Rbuildignore|src/)|Cargo\.(toml|lock)|crates/[^/]+/Cargo\.toml|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install as install_github does, and run a test file on it
        if: steps.rbuild.outputs.run == 'true'
        run: |
          # Forward slashes: R reads the paths inside string literals.
          tmp=$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")
          Rscript -e "r <- getOption('repos'); if (is.null(r) || r['CRAN'] %in% c('@CRAN@', NA)) { r['CRAN'] <- 'https://cloud.r-project.org'; options(repos = r) }; install.packages(c('remotes', 'pkgbuild'))"
          git archive --format=tar.gz --prefix=prospicio/ -o "$tmp/repo.tar.gz" HEAD
          mkdir "$tmp/rlib"
          Rscript -e "remotes::install_local('$tmp/repo.tar.gz', subdir = 'R/prospicio', lib = '$tmp/rlib', dependencies = FALSE, upgrade = 'never', force = TRUE)"
          R_LIBS="$tmp/rlib" Rscript \
            -e "stopifnot(normalizePath(dirname(find.package('prospicio')), '/') == normalizePath('$tmp/rlib', '/'))" \
            -e "source('R/prospicio/tests/test-distributions.R')"

  # The R twins of the example notebooks (examples/one_year_view.qmd and
  # examples/reinsurance_pricing.qmd, #271), on the nightly and manual runs
  # only (the user's decision of 2026-10-22), Ubuntu only: rendered with
  # Quarto to GitHub markdown at 4,000 simulations, then the notebooks run
  # at the same count and test_examples.py's r_twin tests compare what both
  # print (the one-year view's results line by line, the reinsurance
  # pricing comparisons' summary line). Pull requests skip the job.
  examples-r:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      PROSPICIO_EXAMPLE_SIMS: "4000"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: >-
          Rscript -e "pkgs <- c('S7', 'ggplot2', 'knitr', 'rmarkdown'); install.packages(pkgs);
          for (p in pkgs) if (!requireNamespace(p, quietly = TRUE)) stop(p, ' did not install')"
      - run: R CMD INSTALL R/prospicio
      - name: Render the R twins
        run: |
          mkdir -p "$RUNNER_TEMP/r-twins"
          for f in one_year_view reinsurance_pricing; do
            quarto render "examples/$f.qmd" --to gfm --output-dir "$RUNNER_TEMP/r-twins"
          done
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
        working-directory: python
      - name: Compare the R twins with the notebooks
        working-directory: python
        env:
          PROSPICIO_R_TWINS: ${{ runner.temp }}/r-twins
        # The r_twin tests skip without the renders, so check they are there.
        run: |
          test -f "$PROSPICIO_R_TWINS/one_year_view.md"
          test -f "$PROSPICIO_R_TWINS/reinsurance_pricing.md"
          uv run pytest tests/test_examples.py -k r_twin -v -rs

  # Checks that the committed generated files (the Python stub, R's man/,
  # NAMESPACE and R/extendr-wrappers.R) are current. On a pull request that
  # touches the bindings it runs `cargo xtask generated --check` (#823): the
  # extension and stub, roxygen2, the R install with the extendr wrappers,
  # undoc/codoc and pkgdown's reference index (built as the site builds it),
  # without rendering a site,
  # about a quarter of the full build. It renders both sites with
  # `cargo xtask docs --check --no-tests`, uploaded as an artifact, only when
  # the PR touches the sites' configuration or xtask, and on the nightly and
  # manual runs. A PR that changes only guides or notebooks skips the job, as
  # before #823: the python and r jobs run every guide's code and check its
  # printed numbers (test_guides.py, test-guides.R), and pages.yml renders
  # the sites on main, sharing this job's cache (`shared-key: docs-site`), so
  # a break that only the render shows is found there. Neither mode runs the
  # test suites.
  #
  # On a pull request it runs only when the PR touches the bindings, their
  # docs config or xtask; otherwise its steps are skipped and it passes.
  docs:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether the docs inputs changed
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "render=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$changed" | grep -qE '^(crates/prospicio-python/|crates/prospicio-r/|python/|R/|xtask/|\.github/workflows/ci\.yml)'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
            echo "No bindings or docs inputs changed; skipping the docs build."
          fi
          if echo "$changed" | grep -qE '^(xtask/|python/(great-docs\.yml|docs-site\.css)|R/prospicio/(_pkgdown\.yml|pkgdown/))'; then
            echo "render=true" >> "$GITHUB_OUTPUT"
          else
            echo "render=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.docs == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.changes.outputs.docs == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs-site
      - if: steps.changes.outputs.docs == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.changes.outputs.docs == 'true' && steps.changes.outputs.render == 'true'
        uses: quarto-dev/quarto-actions/setup@v2
      - if: steps.changes.outputs.docs == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - if: steps.changes.outputs.docs == 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R/prospicio
          extra-packages: any::roxygen2, any::pkgload, any::pkgdown
      - if: steps.changes.outputs.docs == 'true' && steps.changes.outputs.render != 'true'
        run: cargo xtask generated --check
      - if: steps.changes.outputs.docs == 'true' && steps.changes.outputs.render == 'true'
        run: cargo xtask docs --check --no-tests
      - if: steps.changes.outputs.docs == 'true' && steps.changes.outputs.render == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: target/docs-site

  # The deal report templates (examples/templates/, #605) rendered with
  # Quarto on the sample tables in examples/data/deal_report/: the R twin
  # with knitr, the Python one with Jupyter (papermill takes `-P`). Each
  # stops on a missing table or column, so the render checks the tables'
  # columns; python/tests/test_guides.py checks the tables against the guide
  # that writes them. Neither template needs prospicio, so nothing is built.
  # On a pull request it runs only when the templates, the sample tables,
  # their guide or this file change.
  deal-report:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether the report's inputs changed
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "report=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -qE '^(examples/templates/|examples/data/deal_report/|docs/guides/submission-schema\.md|\.github/workflows/ci\.yml)'; then
            echo "report=true" >> "$GITHUB_OUTPUT"
          else
            echo "report=false" >> "$GITHUB_OUTPUT"
            echo "No report template inputs changed; skipping the render."
          fi
      - if: steps.changes.outputs.report == 'true'
        uses: quarto-dev/quarto-actions/setup@v2
      - if: steps.changes.outputs.report == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - if: steps.changes.outputs.report == 'true'
        run: >-
          Rscript -e "pkgs <- c('knitr', 'rmarkdown'); install.packages(pkgs);
          for (p in pkgs) if (!requireNamespace(p, quietly = TRUE)) stop(p, ' did not install')"
      - if: steps.changes.outputs.report == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.changes.outputs.report == 'true'
        name: Render both templates on the sample tables
        working-directory: examples/templates
        run: |
          out="$RUNNER_TEMP/deal-report"
          quarto render deal_report.qmd --to gfm --output-dir "$out" -P tables:../data/deal_report
          uv run --no-project --with jupyter --with papermill \
            quarto render deal_report_py.qmd --to gfm --output-dir "$out" -P tables:../data/deal_report
          for f in deal_report deal_report_py; do
            grep -q '^## Investor returns' "$out/$f.md"
            grep -q '^| total' "$out/$f.md"
          done

  # GLM parity at scale: the freMTPL2 claim frequency GLM and claim
  # indicator logit (678,013 policies) and the freMTPL2sev gamma severity
  # GLM against statsmodels, and the tabular networks' embeddings against
  # a one-hot CANN, in a release build (about 90 s; several minutes
  # unoptimized). The data is downloaded from OpenML once and cached. On a
  # pull request it runs only when the GLM or network code or the freMTPL2
  # parity files change; otherwise its steps are skipped. On a
  # push to main it only builds the test, if its cache is missing.
  fremtpl2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether the GLM inputs changed
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -qE '^(crates/prospicio-glm/|crates/prospicio-models/|crates/prospicio-math/|crates/prospicio-nn/|validation/(tests|scripts|reference)/.*fremtpl2|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No GLM inputs changed; skipping the freMTPL2 parity."
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.changes.outputs.run == 'true'
        id: cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release
      - if: steps.changes.outputs.run == 'true' && (github.event_name != 'push' || steps.cache.outputs.cache-hit != 'true')
        run: cargo test --release -p prospicio-validation --test fremtpl2 --no-run
      - if: steps.changes.outputs.run == 'true' && github.event_name != 'push'
        uses: actions/cache@v4
        with:
          path: validation/data/external
          key: fremtpl2-${{ hashFiles('validation/scripts/fetch_fremtpl2.py') }}
      - if: steps.changes.outputs.run == 'true' && github.event_name != 'push'
        name: Fetch freMTPL2freq and freMTPL2sev
        run: |
          test -f validation/data/external/freMTPL2freq_glm.csv             && test -f validation/data/external/freMTPL2sev_glm.csv             || python3 validation/scripts/fetch_fremtpl2.py
      - if: steps.changes.outputs.run == 'true' && github.event_name != 'push'
        run: cargo test --release -p prospicio-validation --test fremtpl2
        env:
          RISK_RS_REQUIRE_FREMTPL2: "1"

  # The Bayesian (NUTS) tests, in release:
  # - the parity tests, the files that validation/Cargo.toml's
  #   [package.metadata.bayes-shards] names, behind the `slow-bayes` feature;
  # - prospicio-reserving's unit tests with its `slow-tests` feature, which
  #   un-ignores the ones that sample with NUTS (about 230 s single-threaded
  #   in debug; about 70 s in release on CI's runner).
  # They are modules of one test binary, `bayes` (validation/build.rs, #825),
  # run in three legs at once (#824), each with its modules as test filters:
  # validation/Cargo.toml's [package.metadata.bayes-shards] names each file's
  # leg, and the job fails when a name is no file, or is in two legs. The
  # rust job's debug tests skip or ignore them. On a pull request
  # this job runs only when their inputs change; otherwise its steps are
  # skipped and it passes. A pull request runs the smoke version of the
  # one-year conformance suite and of the Meyers and compartmental one-year
  # validation; the nightly and manual runs set RISK_RS_FULL_BAYES and run
  # all of it (prospicio_validation::full_bayes; the user's decisions of
  # 2026-10-16 and 2026-10-19). On a push to main it only builds the
  # tests, if its cache is missing.
  bayes:
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b, c]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether the Bayesian inputs changed
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -qE '^(crates/prospicio-(reserving|bayes|prob|core|math|glm|models)/|Cargo\.(toml|lock)|validation/(Cargo\.toml|build\.rs|src/|data/|scripts/stan/)|validation/(tests|scripts|reference)/.*(bayes|meyers|compartmental)|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Bayesian inputs changed; skipping the Bayesian parity."
          fi
          python3 validation/scripts/bayes_shards.py ${{ matrix.shard }} >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.changes.outputs.run == 'true'
        id: cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release
      - if: steps.changes.outputs.run == 'true' && (github.event_name != 'push' || steps.cache.outputs.cache-hit != 'true')
        name: Build the Bayesian tests in release
        run: |
          cargo test --release -p prospicio-validation --features slow-bayes --test bayes --no-run
          if [ "${{ steps.changes.outputs.unit }}" = true ]; then
            cargo test --release -p prospicio-reserving --features slow-tests --lib --no-run
          fi
      - if: steps.changes.outputs.run == 'true' && github.event_name != 'push'
        name: Run the Bayesian parity tests in release
        env:
          RISK_RS_FULL_BAYES: ${{ github.event_name != 'pull_request' && '1' || '' }}
        run: |
          echo "RISK_RS_FULL_BAYES=${RISK_RS_FULL_BAYES:-} (empty: the pull request's smoke run)"
          echo "cargo test --release -p prospicio-validation --features slow-bayes ${{ steps.changes.outputs.tests }}"
          cargo test --release -p prospicio-validation --features slow-bayes ${{ steps.changes.outputs.tests }}
      - if: steps.changes.outputs.run == 'true' && github.event_name != 'push' && steps.changes.outputs.unit == 'true'
        name: Run the NUTS unit tests in release
        run: cargo test --release -p prospicio-reserving --features slow-tests --lib

  # Licences, RustSec advisories, duplicate versions and sources of the
  # dependency tree (deny.toml, #573). Pull requests run it when they touch
  # the dependencies or the rules; the nightly and manual runs always do, so
  # a new advisory on an unchanged lock file still shows up.
  deny:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether the dependencies changed
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -qE '(^|/)Cargo\.(toml|lock)$|^deny\.toml$|^\.github/workflows/ci\.yml$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No dependency changes; skipping cargo deny."
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
