name: CI

# Cost: the repo is private, so minutes are billed and Windows counts double.
# Pull requests run Ubuntu only; Windows runs on the weekly schedule and on
# demand. A push to main runs only the Rust job, since its PR already passed;
# the jobs that run a slow suite in a release build (bayes, fremtpl2) run on
# a PR that touches their inputs and on the weekly and manual runs. Tests
# that sample with NUTS stay out of the rust job's debug `cargo test`: the
# Bayesian parity files sit behind prospicio-validation's `slow-bayes`, and
# prospicio-reserving's NUTS unit tests are ignored without its `slow-tests`.
# Of the slowest Bayesian checks, Meyers' and the compartmental models'
# one-year views, a PR runs a smoke version (Meyers' CRC; compartmental
# model 1 without its refit comparison); the weekly
# and manual runs set RISK_RS_FULL_BAYES and run them all.
# The scheduled run also keeps main's caches warm for new PRs.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# A new push to a branch cancels that branch's run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The knowledge bundle conforms to OKF v0.2 (knowledge/index.md).
      - run: python3 -m pip install --quiet pyyaml && python3 validation/scripts/check_okf.py knowledge
      # Change fragments (changes/README.md) are valid and fold cleanly.
      - run: python3 validation/scripts/fold_changes.py --self-test && python3 validation/scripts/fold_changes.py --check
      # Default members: pure-Rust crates and the parity suite. The feature
      # lints the Bayesian parity tests too, and turns on
      # prospicio-reserving/slow-tests; `cargo test` skips the parity files
      # and ignores the NUTS unit tests (the bayes job runs both in release).
      - run: cargo clippy --all-targets --features prospicio-validation/slow-bayes -- -D warnings
      - run: cargo test
      # The crates in the WASM scope (docs/architecture.md, "Open
      # decisions") build for the browser.
      - run: cargo check --target wasm32-unknown-unknown -p prospicio-core -p prospicio-math -p prospicio-prob -p prospicio-aggregate -p prospicio-pricing -p prospicio-reserving -p prospicio

  python:
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: cargo clippy -p prospicio-python -- -D warnings
      - run: uv sync
        working-directory: python
      - run: uv run pytest tests
        working-directory: python

  r:
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    # PowerShell (the Windows default) aliases `R` to Invoke-History.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.os == 'windows-latest' && 'x86_64-pc-windows-gnu' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: r-lib/actions/setup-r@v2  # installs Rtools on Windows
        with:
          # Binary packages: lightgbm and xgboost take minutes to compile.
          use-public-rspm: true
      - run: cargo clippy -p prospicio-r -- -D warnings
      # lightgbm and xgboost are optional engines for booster_fit(). The
      # boosting tests skip a missing engine and install.packages() only
      # warns on failure, so check that each one loads.
      - run: >-
          Rscript -e "pkgs <- c('S7', 'lightgbm', 'xgboost'); install.packages(pkgs);
          for (p in pkgs) if (!requireNamespace(p, quietly = TRUE)) stop(p, ' did not install')"
      - run: R CMD INSTALL R/prospicio
      - name: Run the R tests
        shell: bash
        run: for f in R/prospicio/tests/*.R; do Rscript "$f" || exit 1; done
      # remotes::install_github(subdir = "R/prospicio") and r-universe build
      # a tarball of R/prospicio alone, which carries its Rust sources only
      # because pkgbuild runs bootstrap.R first. Install from such a tarball,
      # into a library of its own, and run the tests against it. It compiles
      # the crates again (a few minutes), so a PR runs it only when the
      # package's build inputs change; the weekly run always does.
      - name: Check whether the R build inputs changed
        id: rbuild
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git fetch -q --depth=1 origin "${{ github.base_ref }}" && \
              git diff --name-only FETCH_HEAD HEAD \
              | grep -qE '^(R/prospicio/(bootstrap\.R|DESCRIPTION|\.Rbuildignore|src/)|Cargo\.(toml|lock)|crates/[^/]+/Cargo\.toml|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install as install_github does, and run the R tests on it
        if: steps.rbuild.outputs.run == 'true'
        run: |
          # Forward slashes: R reads the paths inside string literals.
          tmp=$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")
          Rscript -e "install.packages(c('remotes', 'pkgbuild'))"
          git archive --format=tar.gz --prefix=prospicio/ -o "$tmp/repo.tar.gz" HEAD
          mkdir "$tmp/rlib"
          Rscript -e "remotes::install_local('$tmp/repo.tar.gz', subdir = 'R/prospicio', lib = '$tmp/rlib', dependencies = FALSE, upgrade = 'never', force = TRUE)"
          for f in R/prospicio/tests/*.R; do
            R_LIBS="$tmp/rlib" Rscript \
              -e "stopifnot(normalizePath(dirname(find.package('prospicio')), '/') == normalizePath('$tmp/rlib', '/'))" \
              -e "source('$f')" || exit 1
          done

  # Builds both bindings through `cargo xtask docs`, which regenerates their
  # docs, and fails if a committed generated file (the Python stub, R's man/
  # and NAMESPACE) was stale. The rendered sites are uploaded as an artifact;
  # publishing them is an open decision (docs/architecture.md).
  #
  # On a pull request it runs only when the PR touches the bindings, their
  # docs config or xtask; otherwise its steps are skipped and it passes.
  docs:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether the docs inputs changed
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -qE '^(crates/prospicio-python/|crates/prospicio-r/|python/|R/|xtask/|\.github/workflows/ci\.yml)'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
            echo "No bindings or docs inputs changed; skipping the docs build."
          fi
      - if: steps.changes.outputs.docs == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.changes.outputs.docs == 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.changes.outputs.docs == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.changes.outputs.docs == 'true'
        uses: quarto-dev/quarto-actions/setup@v2
      - if: steps.changes.outputs.docs == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - if: steps.changes.outputs.docs == 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R/prospicio
          extra-packages: any::roxygen2, any::pkgload, any::pkgdown
      - if: steps.changes.outputs.docs == 'true'
        run: cargo xtask docs --check
      - if: steps.changes.outputs.docs == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: target/docs-site

  # GLM parity at scale: the freMTPL2 claim frequency GLM and claim
  # indicator logit (678,013 policies) and the freMTPL2sev gamma severity
  # GLM against statsmodels, in a release build (about 30 s; several
  # minutes unoptimized). The data is downloaded from OpenML once and
  # cached. On a pull request it runs only when the GLM code or the
  # freMTPL2 parity files change; otherwise its steps are skipped.
  fremtpl2:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether the GLM inputs changed
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -qE '^(crates/prospicio-glm/|crates/prospicio-models/|crates/prospicio-math/|validation/(tests|scripts|reference)/.*fremtpl2|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No GLM inputs changed; skipping the freMTPL2 parity."
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.changes.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: release
      - if: steps.changes.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: validation/data/external
          key: fremtpl2-${{ hashFiles('validation/scripts/fetch_fremtpl2.py') }}
      - if: steps.changes.outputs.run == 'true'
        name: Fetch freMTPL2freq and freMTPL2sev
        run: |
          test -f validation/data/external/freMTPL2freq_glm.csv             && test -f validation/data/external/freMTPL2sev_glm.csv             || python3 validation/scripts/fetch_fremtpl2.py
      - if: steps.changes.outputs.run == 'true'
        run: cargo test --release -p prospicio-validation --test fremtpl2
        env:
          RISK_RS_REQUIRE_FREMTPL2: "1"

  # The Bayesian (NUTS) tests, in release:
  # - the parity tests, the [[test]] targets of validation/Cargo.toml that
  #   require the `slow-bayes` feature, the one place that lists them;
  # - prospicio-reserving's unit tests with its `slow-tests` feature, which
  #   un-ignores the ones that sample with NUTS (about 230 s single-threaded
  #   in debug and about 5 minutes of the rust job on 2026-10-15; about 4 s
  #   in release).
  # The rust job's debug `cargo test` skips or ignores them. On a pull
  # request this job runs only when their inputs change; otherwise its
  # steps are skipped and it passes. A pull request runs the smoke version
  # of the Meyers and compartmental one-year validation; the weekly and
  # manual runs set RISK_RS_FULL_BAYES and run all of it
  # (prospicio_validation::full_bayes; the user's decision of 2026-10-16).
  bayes:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether the Bayesian inputs changed
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -qE '^(crates/prospicio-(reserving|bayes|prob|core|math|glm|models)/|Cargo\.(toml|lock)|validation/(Cargo\.toml|src/|data/|scripts/stan/)|validation/(tests|scripts|reference)/.*(bayes|meyers|compartmental)|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Bayesian inputs changed; skipping the Bayesian parity."
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.changes.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: release
      - if: steps.changes.outputs.run == 'true'
        name: Run the Bayesian parity tests in release
        env:
          RISK_RS_FULL_BAYES: ${{ github.event_name != 'pull_request' && '1' || '' }}
        run: |
          echo "RISK_RS_FULL_BAYES=${RISK_RS_FULL_BAYES:-} (empty: the pull request's smoke run)"
          tests=$(python3 -c "import tomllib; t = tomllib.load(open('validation/Cargo.toml', 'rb')); print(' '.join('--test ' + x['name'] for x in t['test'] if 'slow-bayes' in x.get('required-features', [])))")
          echo "cargo test --release -p prospicio-validation --features slow-bayes $tests"
          cargo test --release -p prospicio-validation --features slow-bayes $tests
      - if: steps.changes.outputs.run == 'true'
        name: Run the NUTS unit tests in release
        run: cargo test --release -p prospicio-reserving --features slow-tests --lib
