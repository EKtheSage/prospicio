name: CI

# Wait: the repository is public, so its minutes are not billed; the limits
# below keep a pull request's wait short (#828). Pull requests run Ubuntu
# only; the full matrix with Windows runs nightly and on demand, so a
# Windows failure shows within a day (macOS and aarch64 are built by
# release.yml, whose dry run is nightly). A pull request runs the python and r jobs unless it touches only
# docs, knowledge, change fragments or lane status (DOCS_ONLY below), and
# the jobs that run a slow suite in a release build (bayes, fremtpl2) and
# cargo deny (deny) only when it touches their inputs. A push to main runs the Rust job's checks
# and, in every other job but docs, only builds what that job's cache is
# missing (the cache's key changes with Cargo.lock and the toolchain), so
# that pull requests, which can read main's caches but not each other's,
# start warm; the Pages build (pages.yml) keeps the docs job's cache warm
# the same way. The python, r and bayes jobs are test legs on what a build
# job compiled once (python-build, r-build, bayes-build; #965), passed as an
# artifact, so only the build jobs need Rust and a cache. Tests that sample with NUTS stay out of the rust job's
# debug tests: the Bayesian parity files sit behind prospicio-validation's
# `slow-bayes`, and prospicio-reserving's NUTS unit tests are ignored
# without its `slow-tests`. Of the slowest Bayesian checks, the one-year
# conformance suite and Meyers' and the compartmental models' one-year
# views, a PR runs a smoke version (the conformance suite on BayesOdp and
# BayesBf; Meyers' CRC; compartmental model 1 without its refit
# comparison); the nightly and manual runs set RISK_RS_FULL_BAYES and run
# them all.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly (#828): the full matrix, Windows included.
    - cron: "17 6 * * *"
  workflow_dispatch:

# A new push to a pull request's branch cancels that branch's run still in
# progress. Pushes to main, the nightly run and manual runs each get a group
# of their own, so a merge never cancels the nightly run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # `cargo xtask check --changed` repeats DOCS_ONLY in xtask/src/check.rs;
  # keep the two in step (its unit test lists sample paths).
  # Paths a pull request can change without running the python and r jobs:
  # nothing in them is built or read by the bindings' tests (the guides in
  # docs/guides and the notebooks in examples/ are).
  DOCS_ONLY: '^(knowledge/|changes/|docs/(lanes|design)/|docs/[^/]+\.md$|[^/]+\.md$|crates/prospicio-xll/|crates/prospicio-wasm/|xtask/|\.github/workflows/(xll|release|pages)\.yml$|validation/scripts/(check_okf|check_lanes|test_check_lanes|test_rerun_references|check_bindings|test_check_bindings|fold_changes|bayes_shards)\.py$|validation/bindings-allowlist\.toml$|deny\.toml$)'

jobs:
  # The checks every pull request needs, a few seconds in all (#827): the
  # formatting, the knowledge bundle, the change fragments, the lane status
  # files and the bindings' coverage. They run whatever the PR touches.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      # The knowledge bundle conforms to OKF v0.2 (knowledge/index.md).
      - run: python3 -m pip install --quiet pyyaml && python3 validation/scripts/check_okf.py knowledge
      # Change fragments (changes/README.md) are valid and fold cleanly.
      - run: python3 validation/scripts/fold_changes.py --self-test && python3 validation/scripts/fold_changes.py --check
      # Lane status files (docs/lanes/*.md) have ids and no resurrected bullets.
      - run: python3 validation/scripts/test_check_lanes.py && python3 validation/scripts/check_lanes.py
      # The weekly rerun's comparison rules (#935).
      - run: python3 validation/scripts/test_rerun_references.py
      # Public Rust items are bound in Python and R or on the allow-list
      # (validation/bindings-allowlist.toml); prints the coverage table.
      - run: python3 validation/scripts/test_check_bindings.py && python3 validation/scripts/check_bindings.py
      # Each parity reference file tied to its generator and hash (#844).
      - run: python3 validation/scripts/check_reference_manifest.py
      # Every slow Bayesian target is in one leg of the bayes job, and every
      # leg is one its matrix runs (#824).
      - run: python3 validation/scripts/bayes_shards.py

  # What a pull request's diff asks for, decided once (#966): before, every
  # job cloned the whole history to decide whether to skip itself. The other
  # jobs read these outputs; one that is not a matrix and feeds no other job
  # is skipped as a whole, without a runner, and a skipped job passes. Every
  # output is true on the other events (msrv: not on a push), where each job
  # has rules of its own. `cargo xtask check --changed` (xtask/src/check.rs)
  # reads the same filters (`DOCS_ONLY` above and the rust and docs outputs
  # below): change them together. The clone has the history but no file contents
  # (`blob:none`): the diff needs names only.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      msrv: ${{ steps.filter.outputs.msrv }}
      bindings: ${{ steps.filter.outputs.bindings }}
      rbuild: ${{ steps.filter.outputs.rbuild }}
      docs: ${{ steps.filter.outputs.docs }}
      render: ${{ steps.filter.outputs.render }}
      report: ${{ steps.filter.outputs.report }}
      fremtpl2: ${{ steps.filter.outputs.fremtpl2 }}
      bayes: ${{ steps.filter.outputs.bayes }}
      deny: ${{ steps.filter.outputs.deny }}
      wasm: ${{ steps.filter.outputs.wasm }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Decide what runs
        id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          out() { echo "$1=$2" | tee -a "$GITHUB_OUTPUT"; }
          if [ "$EVENT" != pull_request ]; then
            for k in rust bindings rbuild docs render report fremtpl2 bayes deny wasm; do out "$k" true; done
            out msrv "$([ "$EVENT" = push ] && echo false || echo true)"
            exit 0
          fi
          changed="$RUNNER_TEMP/changed.txt"
          git diff --name-only "origin/$BASE...HEAD" > "$changed"
          echo "$(wc -l < "$changed") files changed"
          # any RE: a changed file matches. other RE: one does not.
          any() { grep -qE "$1" "$changed" && echo true || echo false; }
          other() { grep -qvE "$1" "$changed" && echo true || echo false; }
          # rust: anything but docs, knowledge, change fragments and lane
          # status; the Excel add-in and xtask are Rust (#827).
          rust_free="${DOCS_ONLY//crates\/prospicio-xll\/|/}"
          rust_free="${rust_free//crates\/prospicio-wasm\/|/}"
          rust_free="${rust_free//xtask\/|/}"
          out rust "$(other "$rust_free")"
          # msrv: the manifests and the lock file (the nightly run checks
          # the code against the declared rust-version).
          out msrv "$(any '(^|/)Cargo\.(toml|lock)$|^\.github/workflows/ci\.yml$')"
          # bindings: the python and r jobs.
          out bindings "$(other "$DOCS_ONLY")"
          # rbuild: the R package's install-from-tarball check.
          out rbuild "$(any '^(R/prospicio/(bootstrap\.R|DESCRIPTION|\.Rbuildignore|src/)|Cargo\.(toml|lock)|crates/[^/]+/Cargo\.toml|\.github/workflows/ci\.yml)')"
          # docs: the generated files' inputs (the bindings' sources, the
          # Python package and the R package's code and documentation, not
          # their tests); render: the sites' configuration.
          out docs "$(any '^(crates/prospicio-python/|crates/prospicio-r/|python/(prospicio/|pyproject\.toml|uv\.lock|great-docs\.yml|docs-site\.css)|R/prospicio/(R/|DESCRIPTION|NAMESPACE|man/|_pkgdown\.yml|pkgdown/|src/)|xtask/|\.github/workflows/ci\.yml)')"
          out render "$(any '^(xtask/|python/(great-docs\.yml|docs-site\.css)|R/prospicio/(_pkgdown\.yml|pkgdown/))')"
          out report "$(any '^(examples/templates/|examples/data/deal_report/|docs/guides/submission-schema\.md|\.github/workflows/ci\.yml)')"
          out fremtpl2 "$(any '^(crates/prospicio-glm/|crates/prospicio-models/|crates/prospicio-math/|crates/prospicio-nn/|validation/(Cargo\.toml|build\.rs)|validation/(tests|scripts|reference)/.*fremtpl2|\.github/workflows/ci\.yml)')"
          out bayes "$(any '^(crates/prospicio-(reserving|bayes|prob|core|math|glm|models)/|Cargo\.(toml|lock)|validation/(Cargo\.toml|build\.rs|src/|data/|scripts/stan/)|validation/(tests|scripts|reference)/.*(bayes|meyers|compartmental)|\.github/workflows/ci\.yml)')"
          out deny "$(any '(^|/)Cargo\.(toml|lock)$|^deny\.toml$|^\.github/workflows/ci\.yml$')"
          # wasm: the JavaScript package (crates/prospicio-wasm) and what it
          # is built from or tested against: the crates in the WASM scope and
          # glm and models (non-optional dependencies of reserving, so linked
          # into the package), the data the tests read, xtask, the cargo
          # config and the manifests.
          out wasm "$(any '^(crates/prospicio-(wasm|core|math|prob|aggregate|pricing|reserving|glm|models)/|validation/(data|reference)/|xtask/|\.cargo/|Cargo\.(toml|lock)$|\.github/workflows/ci\.yml$)')"

  # Clippy, the debug tests, rustdoc and the WASM check. A pull request that
  # touches only docs, knowledge, change fragments or lane status skips them
  # (DOCS_ONLY, except the Excel add-in and xtask, which are Rust; #827).
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # Line tables only in the test binaries (#851): panics still name the
    # file and line, and there is less debug information to write and link.
    # Local builds keep full debug information (Cargo.toml's dev profile).
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Default members: pure-Rust crates and the parity suite. The feature
      # lints the Bayesian parity tests too, and turns on
      # prospicio-reserving/slow-tests; `cargo test` skips the parity files
      # and ignores the NUTS unit tests (the bayes job runs both in
      # release). The dev profile is optimized (Cargo.toml), which took the
      # debug tests from about 7 minutes to about 1.
      - run: cargo clippy --all-targets --features prospicio-validation/slow-bayes -- -D warnings
      - run: cargo test
      # Rustdoc with warnings denied, as the docs job runs it (cargo xtask rust),
      # but on every PR: a crate-only PR does not trigger the docs job.
      - run: cargo xtask rust
      # The crates in the WASM scope (docs/architecture.md, "Open
      # decisions") build for the browser.
      - run: cargo check --target wasm32-unknown-unknown -p prospicio-core -p prospicio-math -p prospicio-prob -p prospicio-aggregate -p prospicio-esg -p prospicio-pricing -p prospicio-reserving -p prospicio

  # The JavaScript package (crates/prospicio-wasm, docs/design/wasm.md):
  # clippy for the wasm32 target, the bindings' tests under Node
  # (wasm-bindgen-test, against the parity rows) and the built npm package's
  # own tests (`cargo xtask wasm`). It runs when the changes job's wasm
  # output is true (the binding crate, a crate in the WASM scope, the data
  # the tests read, xtask, the manifests or this workflow) and on the
  # nightly and manual runs, not on a push to main. `cargo xtask check
  # --changed` reads the same filter (xtask/src/check.rs).
  wasm:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.wasm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The command-line tool must be the version of the wasm-bindgen crate
      # that crates/prospicio-wasm pins; rust-cache keeps ~/.cargo/bin, so
      # this compiles only when the pin moves.
      - name: Install wasm-bindgen at the pinned version
        shell: bash
        run: |
          version=$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' crates/prospicio-wasm/Cargo.toml)
          if [ "$(wasm-bindgen --version 2>/dev/null)" != "wasm-bindgen $version" ]; then
            cargo install wasm-bindgen-cli --version "$version" --locked --force
          fi
      - run: cargo clippy -p prospicio-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings
      # The runner is set in .cargo/config.toml: Node runs the tests.
      - run: cargo test -p prospicio-wasm --target wasm32-unknown-unknown
      # The npm package, with its tests as a JavaScript program runs them.
      - run: cargo xtask wasm
      - uses: actions/upload-artifact@v4
        with:
          name: prospicio-wasm-pkg
          path: target/wasm/pkg
          retention-days: 7

  # The workspace builds on the rust-version it declares (Cargo.toml,
  # 1.92), so the manifest cannot drift from the code again (#829). The R
  # bindings need R installed, so they are checked by the r job instead.
  # Nightly and on manual runs; a pull request runs it only when it touches
  # a manifest or the lock file (#966), since a dependency's new
  # rust-version is what moved the minimum before, so code that needs a
  # newer compiler than the manifest declares shows within a day.
  msrv:
    needs: changes
    if: needs.changes.outputs.msrv == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The declared rust-version
        id: msrv
        shell: bash
        run: echo "version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --workspace --exclude prospicio-r --all-targets --features prospicio-validation/slow-bayes,prospicio-reserving/io,prospicio-prob/arrow

  # The Python package, built once per platform (#965): a release wheel
  # (abi3, as release.yml builds it), kept as an artifact for a day, that
  # every leg of the python job installs. Before, each of the four legs compiled
  # prospicio-python in release itself, Burn and nuts-rs included. Clippy on
  # the bindings runs here, beside the build it shares its dependencies
  # with. On a push to main the job builds only when its cache is not an
  # exact match, to fill the cache pull requests read, and uploads nothing.
  python-build:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.bindings == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # On a push to main, build only if the restore was not an exact match
      # (the post step then saves the cache).
      - if: needs.changes.outputs.bindings == 'true'
        id: cache
        uses: Swatinem/rust-cache@v2
      - name: Plan
        id: plan
        run: |
          run=${{ needs.changes.outputs.bindings }}
          push=${{ github.event_name == 'push' }}
          hit=${{ steps.cache.outputs.cache-hit == 'true' }}
          echo "build=$([ "$run" = true ] && ! { [ "$push" = true ] && [ "$hit" = true ]; } && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.build == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - if: steps.plan.outputs.build == 'true'
        run: cargo clippy -p prospicio-python -- -D warnings
      # maturin through PEP 517, in release, into the workspace's target/.
      - if: steps.plan.outputs.build == 'true'
        run: uv build --wheel --out-dir dist
        working-directory: python
      - if: steps.plan.outputs.build == 'true' && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.os }}
          path: python/dist/*.whl
          if-no-files-found: error
          retention-days: 1

  # Four legs, each on a runner of its own (#848, #850). Most of the
  # suite's time is a dozen Bayesian and compartmental tests whose NUTS
  # chains already use every core through rayon: four xdist workers on one
  # runner made them three to five times slower (with one rayon thread each,
  # or with the default), so they run serially with every thread, on
  # runners of their own (`slow-1` and `slow-2`: PY_SLOW_1, PY_SLOW_2) or at
  # the end of `tests` (PY_ALONE), whose other files run first on four
  # workers with one rayon thread each. `guides` runs the guides and
  # notebooks one at a time, since each guide must finish within 30 s
  # (test_guides.py). The lists balance the legs at about four minutes of
  # tests each (2026-11-11). Each leg installs python-build's wheel beside
  # the locked test dependencies and needs no Rust toolchain (#965); on a
  # push to main, and when the pull request touches none of the bindings'
  # inputs, its steps are skipped.
  python:
    needs: [changes, python-build]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
        part: [tests, slow-1, slow-2, guides]
    runs-on: ${{ matrix.os }}
    env:
      TEST: ${{ needs.changes.outputs.bindings == 'true' && github.event_name != 'push' }}
      PY_SLOW_1: tests/test_reserving_compartmental.py
      PY_SLOW_2: >-
        tests/test_reserving_hierarchical_bf.py
        tests/test_reserving_compartmental_backtest.py
      PY_ALONE: >-
        tests/test_reserving_compartmental_segments.py
        tests/test_reserving_compartmental_one_year_segments.py
        tests/test_reserving_pattern_draws.py
        tests/test_boosting.py
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - if: env.TEST == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - if: env.TEST == 'true'
        uses: actions/download-artifact@v4
        with:
          name: python-wheel-${{ matrix.os }}
          path: python/dist
      # The locked test dependencies without the project, then the wheel:
      # `uv run --no-sync` below keeps uv from building the project itself.
      - if: env.TEST == 'true'
        name: Install the wheel and the test dependencies
        run: |
          uv sync --no-install-project
          uv pip install --no-deps dist/*.whl
        working-directory: python
      # tests: four workers (pytest-xdist), each file on one worker so its
      # module fixtures load once, one rayon thread per worker so four
      # workers do not start sixteen threads on four cores (no result
      # depends on the thread count: one RNG stream per simulation); then
      # PY_ALONE serially, the NUTS fits and the boosting tests, whose
      # LightGBM and XGBoost threads also slow down beside other processes.
      # The slowest tests' times in the log (#826).
      - if: env.TEST == 'true'
        name: Run the ${{ matrix.part }} leg
        run: |
          durations="--durations=25 --durations-min=5"
          pytest="uv run --no-sync pytest"
          case "${{ matrix.part }}" in
            tests)
              ignore="--ignore=tests/test_guides.py --ignore=tests/test_examples.py"
              for f in $PY_SLOW_1 $PY_SLOW_2 $PY_ALONE; do ignore="$ignore --ignore=$f"; done
              RAYON_NUM_THREADS=1 $pytest tests -n 4 --dist loadfile $ignore $durations
              $pytest $PY_ALONE $durations ;;
            slow-1) $pytest $PY_SLOW_1 $durations ;;
            slow-2) $pytest $PY_SLOW_2 $durations ;;
            guides) $pytest tests/test_guides.py tests/test_examples.py $durations ;;
          esac
        working-directory: python

  # The R package, built once per platform (#965): `R CMD INSTALL --build`
  # compiles prospicio-r in release and writes a binary package, kept as an
  # artifact for a day, that every leg of the r job installs. Before, each of the
  # three legs ran `R CMD INSTALL R/prospicio` and compiled the crates
  # itself. Clippy on the bindings and the install-from-tarball check, which
  # compiles the crates again, run here, where the Rust toolchain is. On a
  # push to main the job builds only when its cache is not an exact match,
  # and uploads nothing.
  r-build:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    # PowerShell (the Windows default) aliases `R` to Invoke-History.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.bindings == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.os == 'windows-latest' && 'x86_64-pc-windows-gnu' || '' }}
      # On a push to main, build only if the restore was not an exact match
      # (the post step then saves the cache).
      - if: needs.changes.outputs.bindings == 'true'
        id: cache
        uses: Swatinem/rust-cache@v2
      - name: Plan
        id: plan
        run: |
          run=${{ needs.changes.outputs.bindings }}
          push=${{ github.event_name == 'push' }}
          hit=${{ steps.cache.outputs.cache-hit == 'true' }}
          echo "build=$([ "$run" = true ] && ! { [ "$push" = true ] && [ "$hit" = true ]; } && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "test=$([ "$run" = true ] && [ "$push" = false ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.build == 'true'
        uses: r-lib/actions/setup-r@v2  # installs Rtools on Windows
        with:
          use-public-rspm: true
      - if: steps.plan.outputs.build == 'true'
        run: cargo clippy -p prospicio-r -- -D warnings
      # S7 is the package's one import outside base R. Through pak, with the
      # library cached between runs (#966); hard dependencies only.
      - if: steps.plan.outputs.build == 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::S7
          dependencies: 'NA'
      # Installs the package and writes the binary package beside it
      # (prospicio_<version>_R_<platform>.tar.gz; a .zip on Windows).
      - if: steps.plan.outputs.build == 'true'
        name: Build the binary package
        run: |
          mkdir r-dist
          cd r-dist
          R CMD INSTALL --build ../R/prospicio
          ls -l
      - if: steps.plan.outputs.build == 'true' && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: r-package-${{ matrix.os }}
          path: r-dist/prospicio_*
          if-no-files-found: error
          retention-days: 1
      # remotes::install_github(subdir = "R/prospicio") and r-universe build
      # a tarball of R/prospicio alone, which carries its Rust sources only
      # because pkgbuild runs bootstrap.R first. Install from such a tarball,
      # into a library of its own, and run one test file against it: the
      # full suite runs on the binary package in the r job. It compiles the
      # crates again (a few minutes), so a PR runs it only when the
      # package's build inputs change; the nightly run always does.
      - name: Install as install_github does, and run a test file on it
        if: steps.plan.outputs.test == 'true' && needs.changes.outputs.rbuild == 'true'
        run: |
          # Forward slashes: R reads the paths inside string literals.
          tmp=$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")
          Rscript -e "r <- getOption('repos'); if (is.null(r) || r['CRAN'] %in% c('@CRAN@', NA)) { r['CRAN'] <- 'https://cloud.r-project.org'; options(repos = r) }; install.packages(c('remotes', 'pkgbuild'))"
          git archive --format=tar.gz --prefix=prospicio/ -o "$tmp/repo.tar.gz" HEAD
          mkdir "$tmp/rlib"
          Rscript -e "remotes::install_local('$tmp/repo.tar.gz', subdir = 'R/prospicio', lib = '$tmp/rlib', dependencies = FALSE, upgrade = 'never', force = TRUE)"
          R_LIBS="$tmp/rlib" Rscript \
            -e "stopifnot(normalizePath(dirname(find.package('prospicio')), '/') == normalizePath('$tmp/rlib', '/'))" \
            -e "source('R/prospicio/tests/test-distributions.R')"

  # Three legs, each on a runner of its own (#849, #850): `slow`, the
  # compartmental file (about 220 s, the longest), alone; `guides`,
  # tests/test-guides.R; and `tests`, the rest through
  # validation/scripts/run_r_tests.py: four files at a time with one rayon
  # thread each, then the Bayesian files and the boosting tests one at a
  # time with every thread, since four processes on four cores made them
  # three to eight times slower. Each leg installs r-build's binary package
  # and needs no Rust toolchain (#965); on a push to main, and when the
  # pull request touches none of the bindings' inputs, its steps are skipped.
  r:
    needs: [changes, r-build]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
        part: [tests, slow, guides]
    runs-on: ${{ matrix.os }}
    env:
      TEST: ${{ needs.changes.outputs.bindings == 'true' && github.event_name != 'push' }}
    # PowerShell (the Windows default) aliases `R` to Invoke-History.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - if: env.TEST == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          # Binary packages: lightgbm and xgboost take minutes to compile.
          use-public-rspm: true
      # What each leg's files load, and no more (#966): lightgbm and xgboost
      # are optional engines for booster_fit() (test-boosting.R and
      # test-models.R, in `tests`, and a pricing guide's boosting chunks,
      # in `guides`); ggplot2 and gt draw the R guides' figures and tables
      # (test-guides.R). Through pak, with the library
      # cached between runs, hard dependencies only. The boosting tests
      # skip a missing engine, so check that each package loads.
      - if: env.TEST == 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: ${{ matrix.part == 'tests' && 'any::S7, any::lightgbm, any::xgboost' || matrix.part == 'guides' && 'any::S7, any::ggplot2, any::gt, any::lightgbm' || 'any::S7' }}
          dependencies: 'NA'
      - if: env.TEST == 'true'
        env:
          PKGS: ${{ matrix.part == 'tests' && 'S7 lightgbm xgboost' || matrix.part == 'guides' && 'S7 ggplot2 gt lightgbm' || 'S7' }}
        run: Rscript -e "for (p in strsplit(Sys.getenv('PKGS'), ' ')[[1]]) if (!requireNamespace(p, quietly = TRUE)) stop(p, ' did not install')"
      - if: env.TEST == 'true'
        uses: actions/download-artifact@v4
        with:
          name: r-package-${{ matrix.os }}
          path: r-dist
      - if: env.TEST == 'true'
        name: Install the binary package
        run: |
          R CMD INSTALL r-dist/prospicio_*
          Rscript -e "library(prospicio); cat('prospicio', format(packageVersion('prospicio')), 'loads\n')"
      # The optional parity packages (#845): their blocks skip on pull
      # requests, with a SKIP line each in the runner's summary, and run on
      # the nightly and manual runs. install.packages() only warns on
      # failure, so a package that does not build there is skipped too.
      - if: env.TEST == 'true' && matrix.part == 'tests' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: >-
          Rscript -e "r <- getOption('repos'); if (is.null(r) || r['CRAN'] %in% c('@CRAN@', NA)) { r['CRAN'] <- 'https://cloud.r-project.org'; options(repos = r) };
          install.packages(c('actuar', 'glmnet', 'statmod', 'ChainLadder', 'dglm', 'posterior', 'loo'))"
      # validation/scripts/run_r_tests.py runs every file it is given,
      # prints each one's time and result as it finishes (#826), and ends
      # with the log of every failed file, the skipped optional-package
      # blocks and the slowest files (#845).
      - name: Run the R ${{ matrix.part }} leg
        if: env.TEST == 'true'
        run: |
          py=$([ "$RUNNER_OS" = Windows ] && echo python || echo python3)
          case "${{ matrix.part }}" in
            tests)
              # The Bayesian and boosting files run alone after the rest
              # (run_r_tests.py's ALONE).
              $py validation/scripts/run_r_tests.py --jobs 4 \
                --exclude test-guides.R --exclude test-reserving-compartmental.R ;;
            slow) $py validation/scripts/run_r_tests.py test-reserving-compartmental.R ;;
            guides) $py validation/scripts/run_r_tests.py test-guides.R ;;
          esac

  # The R twins of the example notebooks (examples/one_year_view.qmd and
  # examples/reinsurance_pricing.qmd, #271), on the nightly and manual runs
  # only (the user's decision of 2026-10-22), Ubuntu only: rendered with
  # Quarto to GitHub markdown at 4,000 simulations, then the notebooks run
  # at the same count and test_examples.py's r_twin tests compare what both
  # print (the one-year view's results line by line, the reinsurance
  # pricing comparisons' summary line). Pull requests skip the job.
  examples-r:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      PROSPICIO_EXAMPLE_SIMS: "4000"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::S7, any::ggplot2, any::knitr, any::rmarkdown
          dependencies: 'NA'
      - run: Rscript -e "for (p in c('S7', 'ggplot2', 'knitr', 'rmarkdown')) if (!requireNamespace(p, quietly = TRUE)) stop(p, ' did not install')"
      - run: R CMD INSTALL R/prospicio
      - name: Render the R twins
        run: |
          mkdir -p "$RUNNER_TEMP/r-twins"
          for f in one_year_view reinsurance_pricing; do
            quarto render "examples/$f.qmd" --to gfm --output-dir "$RUNNER_TEMP/r-twins"
          done
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - run: uv sync
        working-directory: python
      - name: Compare the R twins with the notebooks
        working-directory: python
        env:
          PROSPICIO_R_TWINS: ${{ runner.temp }}/r-twins
        # The r_twin tests skip without the renders, so check they are there.
        run: |
          test -f "$PROSPICIO_R_TWINS/one_year_view.md"
          test -f "$PROSPICIO_R_TWINS/reinsurance_pricing.md"
          uv run pytest tests/test_examples.py -k r_twin -v -rs

  # Checks that the committed generated files (the Python stub, R's man/,
  # NAMESPACE and R/extendr-wrappers.R) are current. On a pull request that
  # touches the bindings it runs `cargo xtask generated --check` (#823): the
  # extension and stub, roxygen2, the R install with the extendr wrappers,
  # undoc/codoc and pkgdown's reference index (built as the site builds it),
  # without rendering a site,
  # about a quarter of the full build. It renders both sites with
  # `cargo xtask docs --check --no-tests`, uploaded as an artifact, only when
  # the PR touches the sites' configuration or xtask, and on the nightly and
  # manual runs. A PR that changes only guides or notebooks skips the job, as
  # before #823: the python and r jobs run every guide's code and check its
  # printed numbers (test_guides.py, test-guides.R), and pages.yml renders
  # the sites on main, sharing this job's cache (`shared-key: docs-site`), so
  # a break that only the render shows is found there. Neither mode runs the
  # test suites.
  #
  # On a pull request it runs only when the PR touches the bindings' Rust
  # sources, the Python package, the R package's code, documentation or
  # build files, the sites' configuration or xtask (the `docs` output of the
  # changes job); a PR that changes only the bindings' tests skips it
  # (#966), since no generated file reads them.
  docs:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs-site
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - if: needs.changes.outputs.render == 'true'
        uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R/prospicio
          extra-packages: any::roxygen2, any::pkgload, any::pkgdown
      - if: needs.changes.outputs.render != 'true'
        run: cargo xtask generated --check
      - if: needs.changes.outputs.render == 'true'
        run: cargo xtask docs --check --no-tests
      - if: needs.changes.outputs.render == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: target/docs-site

  # The deal report templates (examples/templates/, #605) rendered with
  # Quarto on the sample tables in examples/data/deal_report/: the R twin
  # with knitr, the Python one with Jupyter (papermill takes `-P`). Each
  # stops on a missing table or column, so the render checks the tables'
  # columns; python/tests/test_guides.py checks the tables against the guide
  # that writes them. Neither template needs prospicio, so nothing is built.
  # On a pull request it runs only when the templates, the sample tables,
  # their guide or this file change.
  deal-report:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.report == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::knitr, any::rmarkdown
          dependencies: 'NA'
      - run: Rscript -e "for (p in c('knitr', 'rmarkdown')) if (!requireNamespace(p, quietly = TRUE)) stop(p, ' did not install')"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - name: Render both templates on the sample tables
        working-directory: examples/templates
        run: |
          out="$RUNNER_TEMP/deal-report"
          quarto render deal_report.qmd --to gfm --output-dir "$out" -P tables:../data/deal_report
          uv run --no-project --with jupyter --with papermill \
            quarto render deal_report_py.qmd --to gfm --output-dir "$out" -P tables:../data/deal_report
          for f in deal_report deal_report_py; do
            grep -q '^## Investor returns' "$out/$f.md"
            grep -q '^| total' "$out/$f.md"
          done

  # GLM parity at scale: the freMTPL2 claim frequency GLM and claim
  # indicator logit (678,013 policies) and the freMTPL2sev gamma severity
  # GLM against statsmodels, and the tabular networks' embeddings against
  # a one-hot CANN, in a release build (about 90 s; several minutes
  # unoptimized). The data is downloaded from OpenML once and cached. On a
  # pull request it runs only when the GLM or network code or the freMTPL2
  # parity files change; otherwise it is skipped. On a
  # push to main it only builds the test, if its cache is missing.
  fremtpl2:
    needs: changes
    if: needs.changes.outputs.fremtpl2 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release
      - if: github.event_name != 'push' || steps.cache.outputs.cache-hit != 'true'
        run: cargo test --release -p prospicio-validation --no-default-features --features nn --test fremtpl2 --no-run
      - if: github.event_name != 'push'
        uses: actions/cache@v4
        with:
          path: validation/data/external
          key: fremtpl2-${{ hashFiles('validation/scripts/fetch_fremtpl2.py') }}
      - if: github.event_name != 'push'
        name: Fetch freMTPL2freq and freMTPL2sev
        run: |
          test -f validation/data/external/freMTPL2freq_glm.csv             && test -f validation/data/external/freMTPL2sev_glm.csv             || python3 validation/scripts/fetch_fremtpl2.py
      - if: github.event_name != 'push'
        run: cargo test --release -p prospicio-validation --no-default-features --features nn --test fremtpl2
        env:
          RISK_RS_REQUIRE_FREMTPL2: "1"

  # The Bayesian (NUTS) tests, in release:
  # - the parity tests, the files that validation/Cargo.toml's
  #   [package.metadata.bayes-shards] names, behind the `slow-bayes` feature;
  # - prospicio-reserving's unit tests with its `slow-tests` feature, which
  #   un-ignores the ones that sample with NUTS (about 230 s single-threaded
  #   in debug; about 70 s in release on CI's runner).
  # bayes-build compiles both test binaries once (#965) and keeps them as an
  # artifact for a day; before, each of the three legs compiled them, and on
  # a push to main the three raced to save one cache. The rust job's debug
  # tests skip or ignore these tests. On a pull request the job builds only
  # when their inputs change; otherwise its steps are skipped and it passes.
  # On a push to main it only builds, if its cache is missing.
  bayes-build:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: needs.changes.outputs.bayes == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: needs.changes.outputs.bayes == 'true'
        id: cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release
      # Each binary is built, then named by a second, instant `--no-run`
      # whose JSON messages give the executable's path.
      - if: needs.changes.outputs.bayes == 'true' && (github.event_name != 'push' || steps.cache.outputs.cache-hit != 'true')
        name: Build the Bayesian tests in release
        shell: bash
        run: |
          mkdir bayes-bin
          build() {
            out=$1; shift
            cargo test --release "$@" --no-run
            exe=$(cargo test --release "$@" --no-run --message-format=json 2>/dev/null \
              | jq -r 'select(.reason == "compiler-artifact" and .profile.test and .executable != null) | .executable')
            if [ "$(echo "$exe" | wc -l)" != 1 ] || [ ! -x "$exe" ]; then
              echo "::error::expected one test executable for $out, found: $exe"
              exit 1
            fi
            cp "$exe" "bayes-bin/$out"
          }
          build parity -p prospicio-validation --no-default-features --features slow-bayes --test bayes
          build unit -p prospicio-reserving --features slow-tests --lib
          ls -l bayes-bin
      - if: needs.changes.outputs.bayes == 'true' && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: bayes-tests
          path: bayes-bin
          if-no-files-found: error
          retention-days: 1

  # The Bayesian tests in three legs at once (#824), on bayes-build's
  # binaries, with no Rust toolchain (#965). The parity files are modules of
  # one test binary (validation/build.rs, #825), each leg running its
  # modules as test filters: validation/Cargo.toml's
  # [package.metadata.bayes-shards] names each file's leg, and
  # bayes_shards.py fails when a name is no file, or is in two legs. A test
  # binary run by hand needs what `cargo test` gives it: its package's
  # directory as the working directory. A pull request runs the smoke
  # version of the one-year conformance suite and of the Meyers and
  # compartmental one-year validation; the nightly and manual runs set
  # RISK_RS_FULL_BAYES and run all of it (prospicio_validation::full_bayes;
  # the user's decisions of 2026-10-16 and 2026-10-19). On a push to main,
  # and when the pull request touches none of their inputs, the steps are
  # skipped.
  bayes:
    needs: [changes, bayes-build]
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b, c]
    runs-on: ubuntu-latest
    env:
      TEST: ${{ needs.changes.outputs.bayes == 'true' && github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@v4
      - name: The leg's tests
        id: leg
        run: python3 validation/scripts/bayes_shards.py ${{ matrix.shard }} >> "$GITHUB_OUTPUT"
      - if: env.TEST == 'true'
        uses: actions/download-artifact@v4
        with:
          name: bayes-tests
          path: bayes-bin
      # An artifact does not keep the executable bit.
      - if: env.TEST == 'true'
        run: chmod +x bayes-bin/*
      - if: env.TEST == 'true'
        name: Run the Bayesian parity tests in release
        working-directory: validation
        env:
          RISK_RS_FULL_BAYES: ${{ github.event_name != 'pull_request' && '1' || '' }}
        run: |
          echo "RISK_RS_FULL_BAYES=${RISK_RS_FULL_BAYES:-} (empty: the pull request's smoke run)"
          echo "bayes ${{ steps.leg.outputs.filters }}"
          ../bayes-bin/parity ${{ steps.leg.outputs.filters }}
      - if: env.TEST == 'true' && steps.leg.outputs.unit == 'true'
        name: Run the NUTS unit tests in release
        working-directory: crates/prospicio-reserving
        run: ../../bayes-bin/unit

  # Licences, RustSec advisories, duplicate versions and sources of the
  # dependency tree (deny.toml, #573). Pull requests run it when they touch
  # the dependencies or the rules; the nightly and manual runs always do, so
  # a new advisory on an unchanged lock file still shows up.
  deny:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.deny == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Reports a scheduled run that failed (#936): opens an issue titled
  # "Nightly CI is red", or adds a comment to it when it is already open, and closes
  # it when a scheduled run passes. It runs only on the schedule, whatever
  # the other jobs did, and never fails the run itself (continue-on-error).
  report:
    needs: [checks, changes, rust, wasm, msrv, python-build, python, r-build, r, examples-r, docs, deal-report, fremtpl2, bayes-build, bayes, deny]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: "Nightly CI is red"
      RESULTS: ${{ toJSON(needs) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Open, update or close the issue
        shell: bash
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key' <<< "$RESULTS")
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq 'map(select(.title == env.TITLE)) | first | .number // empty')
          if [ -z "$failed" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "The scheduled run passed: $RUN_URL"
            fi
            exit 0
          fi
          jobs=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | "- [\(.name)](\(.html_url))"' || true)
          [ -n "$jobs" ] || jobs=$(sed 's/^/- /' <<< "$failed")
          body=$(printf 'A scheduled run failed: %s\n\nFailed jobs:\n\n%s\n' "$RUN_URL" "$jobs")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
