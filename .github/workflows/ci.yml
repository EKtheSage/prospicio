name: CI

# Cost: the repo is private, so minutes are billed and Windows counts double.
# Pull requests run Ubuntu only; Windows runs on the weekly schedule and on
# demand. A push to main runs only the Rust job, since its PR already passed.
# The scheduled run also keeps main's caches warm for new PRs.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# A new push to a branch cancels that branch's run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Default members: pure-Rust crates and the parity suite.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  python:
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: cargo clippy -p act-python -- -D warnings
      - run: uv sync
        working-directory: python
      - run: uv run pytest tests
        working-directory: python

  r:
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    # PowerShell (the Windows default) aliases `R` to Invoke-History.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.os == 'windows-latest' && 'x86_64-pc-windows-gnu' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: r-lib/actions/setup-r@v2  # installs Rtools on Windows
      - run: cargo clippy -p act-r -- -D warnings
      - run: Rscript -e "install.packages('S7', repos = 'https://cloud.r-project.org')"
      - run: R CMD INSTALL R/actuarialrs
      - name: Run the R tests
        shell: bash
        run: for f in R/actuarialrs/tests/*.R; do Rscript "$f" || exit 1; done

  # Builds both bindings through `cargo xtask docs`, which regenerates their
  # docs, and fails if a committed generated file (the Python stub, R's man/
  # and NAMESPACE) was stale. The rendered sites are uploaded as an artifact;
  # publishing them is an open decision (docs/architecture.md).
  #
  # On a pull request it runs only when the PR touches the bindings, their
  # docs config or xtask; otherwise its steps are skipped and it passes.
  docs:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether the docs inputs changed
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -qE '^(crates/act-python/|crates/act-r/|python/|R/|xtask/|\.github/workflows/ci\.yml)'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
            echo "No bindings or docs inputs changed; skipping the docs build."
          fi
      - if: steps.changes.outputs.docs == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.changes.outputs.docs == 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.changes.outputs.docs == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.changes.outputs.docs == 'true'
        uses: quarto-dev/quarto-actions/setup@v2
      - if: steps.changes.outputs.docs == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - if: steps.changes.outputs.docs == 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R/actuarialrs
          extra-packages: any::roxygen2, any::pkgload, any::pkgdown
      - if: steps.changes.outputs.docs == 'true'
        run: cargo xtask docs --check
      - if: steps.changes.outputs.docs == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: target/docs-site
