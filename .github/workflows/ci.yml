name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      # Default members: pure-Rust crates and the parity suite.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: astral-sh/setup-uv@v6
      - run: cargo clippy -p act-python -- -D warnings
      - run: uv sync
        working-directory: python
      - run: uv run pytest tests
        working-directory: python

  r:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.os == 'windows-latest' && 'x86_64-pc-windows-gnu' || '' }}
      - uses: r-lib/actions/setup-r@v2  # installs Rtools on Windows
      - run: cargo clippy -p act-r -- -D warnings
      - run: R CMD INSTALL R/actuarialrs
      - run: Rscript R/actuarialrs/tests/test-distributions.R
