name: CI

# Cost: the repo is private, so minutes are billed and Windows counts double.
# Pull requests run Ubuntu only; Windows runs on the weekly schedule and on
# demand. A push to main runs only the Rust job, since its PR already passed.
# The scheduled run also keeps main's caches warm for new PRs.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# A new push to a branch cancels that branch's run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The knowledge bundle conforms to OKF v0.2 (knowledge/index.md).
      - run: python3 -m pip install --quiet pyyaml && python3 validation/scripts/check_okf.py knowledge
      # Default members: pure-Rust crates and the parity suite.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The crates in the WASM scope (docs/architecture.md, "Open
      # decisions") build for the browser.
      - run: cargo check --target wasm32-unknown-unknown -p act-core -p act-math -p act-prob -p act-aggregate -p act-pricing -p act-reserving

  python:
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: cargo clippy -p act-python -- -D warnings
      - run: uv sync
        working-directory: python
      - run: uv run pytest tests
        working-directory: python

  r:
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    # PowerShell (the Windows default) aliases `R` to Invoke-History.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.os == 'windows-latest' && 'x86_64-pc-windows-gnu' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: r-lib/actions/setup-r@v2  # installs Rtools on Windows
        with:
          # Binary packages: lightgbm and xgboost take minutes to compile.
          use-public-rspm: true
      - run: cargo clippy -p act-r -- -D warnings
      # lightgbm and xgboost are optional engines for booster_fit(). The
      # boosting tests skip a missing engine and install.packages() only
      # warns on failure, so check that each one loads.
      - run: >-
          Rscript -e "pkgs <- c('S7', 'lightgbm', 'xgboost'); install.packages(pkgs);
          for (p in pkgs) if (!requireNamespace(p, quietly = TRUE)) stop(p, ' did not install')"
      - run: R CMD INSTALL R/prospicio
      - name: Run the R tests
        shell: bash
        run: for f in R/prospicio/tests/*.R; do Rscript "$f" || exit 1; done

  # Builds both bindings through `cargo xtask docs`, which regenerates their
  # docs, and fails if a committed generated file (the Python stub, R's man/
  # and NAMESPACE) was stale. The rendered sites are uploaded as an artifact;
  # publishing them is an open decision (docs/architecture.md).
  #
  # On a pull request it runs only when the PR touches the bindings, their
  # docs config or xtask; otherwise its steps are skipped and it passes.
  docs:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether the docs inputs changed
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -qE '^(crates/act-python/|crates/act-r/|python/|R/|xtask/|\.github/workflows/ci\.yml)'; then
            echo "docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs=false" >> "$GITHUB_OUTPUT"
            echo "No bindings or docs inputs changed; skipping the docs build."
          fi
      - if: steps.changes.outputs.docs == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.changes.outputs.docs == 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.changes.outputs.docs == 'true'
        uses: astral-sh/setup-uv@v6
      - if: steps.changes.outputs.docs == 'true'
        uses: quarto-dev/quarto-actions/setup@v2
      - if: steps.changes.outputs.docs == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - if: steps.changes.outputs.docs == 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R/prospicio
          extra-packages: any::roxygen2, any::pkgload, any::pkgdown
      - if: steps.changes.outputs.docs == 'true'
        run: cargo xtask docs --check
      - if: steps.changes.outputs.docs == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: target/docs-site

  # GLM parity at scale: the freMTPL2 claim frequency GLM (678,013
  # policies) against statsmodels, in a release build (about 30 s; six
  # minutes unoptimized). The data is downloaded from OpenML once and
  # cached. On a pull request it runs only when the GLM code or the
  # freMTPL2 parity files change; otherwise its steps are skipped.
  fremtpl2:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether the GLM inputs changed
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
              | grep -qE '^(crates/act-glm/|crates/act-models/|crates/act-math/|validation/(tests|scripts|reference)/.*fremtpl2|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No GLM inputs changed; skipping the freMTPL2 parity."
          fi
      - if: steps.changes.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.changes.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: release
      - if: steps.changes.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: validation/data/external
          key: fremtpl2-${{ hashFiles('validation/scripts/fetch_fremtpl2.py') }}
      - if: steps.changes.outputs.run == 'true'
        name: Fetch freMTPL2freq
        run: test -f validation/data/external/freMTPL2freq_glm.csv || python3 validation/scripts/fetch_fremtpl2.py
      - if: steps.changes.outputs.run == 'true'
        run: cargo test --release -p act-validation --test fremtpl2
        env:
          RISK_RS_REQUIRE_FREMTPL2: "1"
