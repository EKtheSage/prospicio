name: Docs site

# Publishes the docs site (Python, R and Rust API docs, built by
# `cargo xtask docs` into target/docs-site) to GitHub Pages on each merge to
# main that can change it, and on demand. The Python site's user guide holds
# the guides in docs/guides and the notebooks in examples/, which the build
# executes: the notebooks are committed without outputs. Pages' source must
# be set to "GitHub Actions" in the repository's settings.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "python/**"
      - "R/**"
      - "xtask/**"
      - "examples/**"
      - "docs/guides/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer merge replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The same cache as ci.yml's docs job, which this build keeps warm.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs-site
      - uses: astral-sh/setup-uv@v6
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R/prospicio
          extra-packages: any::roxygen2, any::pkgload, any::pkgdown
      # The merged code passed CI's tests; the site needs only the build.
      - run: cargo xtask docs --no-tests
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/docs-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
