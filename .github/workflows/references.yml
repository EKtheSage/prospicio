# Rerun the cheap pure-Python reference generators and compare their output
# with the committed files within each row's tolerance (#844). Weekly and on
# demand, never on pull requests, and not a required check: a new release of
# a reference package is the signal this job exists to give, not a fault of
# a pull request. `pinned` runs each generator in the environment its inline
# script metadata pins (a failure there means a committed reference no longer
# matches its generator); `latest` runs it on the newest release of each
# package it names (a failure there means an upstream package moved). See
# validation/scripts/rerun_references.py for the generators and the rules.
name: references

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rerun:
    name: rerun (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mode: [pinned, latest]
    steps:
      - uses: actions/checkout@v4
      # The generators' environments come from their inline metadata, so
      # the cache is keyed on the scripts.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: validation/scripts/*.py
      - name: Rerun the weekly generators
        run: >-
          python3 validation/scripts/rerun_references.py
          ${{ matrix.mode == 'latest' && '--latest' || '' }}
          --report "$GITHUB_STEP_SUMMARY"

  # Reports a scheduled run that failed (#936): opens an issue titled
  # "Weekly reference rerun is red", or adds a comment to it when it is already open, and closes
  # it when a scheduled run passes. It runs only on the schedule, whatever
  # the other jobs did, and never fails the run itself (continue-on-error).
  report:
    needs: [rerun]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      issues: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: "Weekly reference rerun is red"
      RESULTS: ${{ toJSON(needs) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Open, update or close the issue
        shell: bash
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key' <<< "$RESULTS")
          number=$(gh issue list --state open --limit 200 --json number,title \
            --jq 'map(select(.title == env.TITLE)) | first | .number // empty')
          if [ -z "$failed" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "The scheduled run passed: $RUN_URL"
            fi
            exit 0
          fi
          jobs=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | "- [\(.name)](\(.html_url))"' || true)
          [ -n "$jobs" ] || jobs=$(sed 's/^/- /' <<< "$failed")
          body=$(printf 'A scheduled run failed: %s\n\nFailed jobs:\n\n%s\n' "$RUN_URL" "$jobs")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
