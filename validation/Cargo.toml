[package]
name = "prospicio-validation"
description = "Parity harness: reference datasets and results from reference implementations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
authors.workspace = true

[dependencies]
prospicio-reserving = { workspace = true, features = ["bayes"] }

[dev-dependencies]
prospicio-aggregate.workspace = true
prospicio-bayes.workspace = true
prospicio-core.workspace = true
prospicio-glm.workspace = true
prospicio-math.workspace = true
prospicio-models.workspace = true
prospicio-pricing.workspace = true
prospicio-prob = { workspace = true, features = ["arrow"] }
rayon.workspace = true

[features]
# The Bayesian (NUTS) parity tests: about 220 s in a debug build and 17 s in
# release when there were six files (thirteen now, with the one-year views'
# refits, minutes in release), so a plain `cargo test` skips them and CI runs them in release
# (the `bayes` job of .github/workflows/ci.yml). Run them locally with
#   cargo test --release -p prospicio-validation --features slow-bayes \
#     --test 'reserving_bayes*' --test 'reserving_meyers*' \
#     --test 'reserving_compartmental*'
# A new Bayesian parity file gets a [[test]] entry below, and nothing else:
# the CI job reads this list.
# The slowest arms (the Meyers and compartmental one-year views) run a
# smoke version (Meyers' CRC, compartmental model 1 without its refit
# comparison) unless RISK_RS_FULL_BAYES is set, as CI's
# weekly and manual runs set it: prefix the command above with
# RISK_RS_FULL_BAYES=1 for all of them (prospicio_validation::full_bayes).
# prospicio-reserving's own NUTS unit tests run in release with
#   cargo test --release -p prospicio-reserving --features slow-tests --lib
# `slow-bayes` turns that feature on too, so one flag covers every slow
# Bayesian test.
slow-bayes = ["prospicio-reserving/slow-tests"]

[[test]]
name = "reserving_bayes"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_bayes_bf"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_bayes_segments"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_meyers"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_meyers_cay"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_meyers_segments"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_compartmental"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_compartmental_gm2"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_compartmental_segments"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_bayes_one_year"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_bayes_one_year_conformance"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_bayes_bf_one_year"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_bayes_one_year_moment_match"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_meyers_one_year"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_compartmental_one_year"
required-features = ["slow-bayes"]

# The 200-triangle calibration study (docs/design/reserving-calibration.md):
# its unit tests run in a plain `cargo test`; the study itself is #[ignore]d
# and run by hand (see the file's header), so it needs no CI entry. Its
# Bayesian arms need no feature to compile (the validation crate always
# builds prospicio-reserving with `bayes`), and its one slow test, the wiring
# check on group 353, is ignored unless `slow-bayes` is on; a [[test]] entry
# would make CI's `bayes` job run the file, which PR 3 deliberately avoids.
