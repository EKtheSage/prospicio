[package]
name = "prospicio-validation"
description = "Parity harness: reference datasets and results from reference implementations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
# One test binary for the plain tests and one for the Bayesian ones (#825):
# build.rs makes each file of tests/ a module of one of them.
autotests = false
license.workspace = true
authors.workspace = true

[dependencies]
# io: the triangle readers' tests (reserving_io.rs), and with feature
# unification the `io` unit tests of prospicio-reserving in `cargo test`.
prospicio-reserving = { workspace = true, features = ["bayes", "io"] }

[dev-dependencies]
prospicio-aggregate.workspace = true
prospicio-bayes.workspace = true
prospicio-core.workspace = true
prospicio-glm.workspace = true
prospicio-math.workspace = true
prospicio-models.workspace = true
# The tabular networks' freMTPL2 run (fremtpl2.rs); without the ONNX import.
prospicio-nn = { path = "../crates/prospicio-nn", default-features = false }
prospicio-pricing.workspace = true
prospicio-prob = { workspace = true, features = ["arrow"] }
rayon.workspace = true
# The frozen artifacts' documents (artifacts.rs).
serde_json.workspace = true

[package.metadata.bayes-shards]
# The Bayesian parity files: build.rs makes each named here a module of the
# `bayes` test binary (#825), and CI's `bayes` job runs them in three legs at
# once (#824), each leg with its modules as test filters. Each file is named
# in exactly one leg; validation/scripts/bayes_shards.py fails the job
# otherwise, so a new parity file names its leg here. Legs are
# balanced by the run times of a pull request's smoke run (the two largest,
# reserving_compartmental_one_year and reserving_bayes_hierarchical_bf, in
# legs a and b); `unit-tests` names the leg that also runs
# prospicio-reserving's NUTS unit tests (`slow-tests`).
a = [
    "reserving_compartmental_one_year",
    "reserving_bayes_one_year_moment_match",
    "reserving_meyers",
    "reserving_meyers_cay",
    "reserving_meyers_segments",
    "reserving_meyers_one_year",
    "reserving_calibration_meyers",
    "reserving_bayes_bf",
    "reserving_bayes_bf_normalised",
    "reserving_bayes_bf_one_year",
    "reserving_bayes_excess_prior",
    "reserving_bayes_new_year",
]
b = [
    "reserving_bayes_hierarchical_bf",
    "reserving_bayes_hierarchical_bf_one_year",
    "reserving_bayes_one_year_conformance",
    "reserving_bayes",
    "reserving_bayes_segments",
    "reserving_bayes_one_year",
    "reserving_bayes_loss_ratio_draws",
    "reserving_bayes_pattern_draws",
]
c = [
    "reserving_compartmental",
    "reserving_compartmental_incurred",
    "reserving_compartmental_one_response",
    "reserving_compartmental_grain",
    "reserving_compartmental_subannual",
    "reserving_compartmental_gm2",
    "reserving_compartmental_segments",
]
unit-tests = "c"

[features]
# The Bayesian (NUTS) parity tests: about 220 s in a debug build and 17 s in
# release when there were six files (thirteen now, with the one-year views'
# refits, minutes in release), so a plain `cargo test` skips them and CI runs them in release
# (the `bayes` job of .github/workflows/ci.yml). Run them locally with
#   cargo test --release -p prospicio-validation --features slow-bayes --test bayes
# or one file with its module as a filter, `--test bayes reserving_meyers_cay::`.
# A new Bayesian parity file gets a leg in [package.metadata.bayes-shards]
# above, and nothing else: build.rs and the CI job read it.
# The slowest arms (the Meyers and compartmental one-year views) run a
# smoke version (Meyers' CRC, compartmental model 1 without its refit
# comparison) unless RISK_RS_FULL_BAYES is set, as CI's
# nightly and manual runs set it: prefix the command above with
# RISK_RS_FULL_BAYES=1 for all of them (prospicio_validation::full_bayes).
# prospicio-reserving's own NUTS unit tests run in release with
#   cargo test --release -p prospicio-reserving --features slow-tests --lib
# `slow-bayes` turns that feature on too, so one flag covers every slow
# Bayesian test.
slow-bayes = ["prospicio-reserving/slow-tests"]

# The test binaries (#825). `validation`: every file of tests/ that a plain
# `cargo test` runs, each a module (build.rs finds them, so a new file needs
# no line here). `bayes`: the Bayesian parity files, the names in
# [package.metadata.bayes-shards], behind `slow-bayes`; among them the
# 200-triangle calibration study (docs/design/reserving-calibration.md),
# whose unit tests and wiring checks run in CI's `bayes` job and whose study
# stays #[ignore]d. `fremtpl2`: the freMTPL2 parity, alone for CI's
# `fremtpl2` job, which builds it in release.
[[test]]
name = "validation"
path = "tests/validation.rs"

[[test]]
name = "bayes"
path = "tests/bayes.rs"
required-features = ["slow-bayes"]

[[test]]
name = "fremtpl2"
path = "tests/fremtpl2.rs"
