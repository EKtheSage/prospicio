[package]
name = "prospicio-validation"
description = "Parity harness: reference datasets and results from reference implementations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license.workspace = true
authors.workspace = true

[dependencies]
# io: the triangle readers' tests (reserving_io.rs), and with feature
# unification the `io` unit tests of prospicio-reserving in `cargo test`.
prospicio-reserving = { workspace = true, features = ["bayes", "io"] }

[dev-dependencies]
prospicio-aggregate.workspace = true
prospicio-bayes.workspace = true
prospicio-core.workspace = true
prospicio-glm.workspace = true
prospicio-math.workspace = true
prospicio-models.workspace = true
# The tabular networks' freMTPL2 run (fremtpl2.rs); without the ONNX import.
prospicio-nn = { path = "../crates/prospicio-nn", default-features = false }
prospicio-pricing.workspace = true
prospicio-prob = { workspace = true, features = ["arrow"] }
rayon.workspace = true
# The frozen artifacts' documents (artifacts.rs).
serde_json.workspace = true

[package.metadata.bayes-shards]
# CI's `bayes` job runs the slow Bayesian targets (the [[test]] entries
# below that require `slow-bayes`) in three legs at once (#824). Each slow
# target is named in exactly one leg; validation/scripts/bayes_shards.py
# fails the job otherwise, so a new parity file names its leg here. Legs are
# balanced by the run times of a pull request's smoke run (the two largest,
# reserving_compartmental_one_year and reserving_bayes_hierarchical_bf, in
# legs a and b); `unit-tests` names the leg that also runs
# prospicio-reserving's NUTS unit tests (`slow-tests`).
a = [
    "reserving_compartmental_one_year",
    "reserving_bayes_one_year_moment_match",
    "reserving_meyers",
    "reserving_meyers_cay",
    "reserving_meyers_segments",
    "reserving_meyers_one_year",
    "reserving_calibration_meyers",
    "reserving_bayes_bf",
    "reserving_bayes_bf_normalised",
    "reserving_bayes_bf_one_year",
    "reserving_bayes_excess_prior",
    "reserving_bayes_new_year",
]
b = [
    "reserving_bayes_hierarchical_bf",
    "reserving_bayes_hierarchical_bf_one_year",
    "reserving_bayes_one_year_conformance",
    "reserving_bayes",
    "reserving_bayes_segments",
    "reserving_bayes_one_year",
    "reserving_bayes_loss_ratio_draws",
    "reserving_bayes_pattern_draws",
]
c = [
    "reserving_compartmental",
    "reserving_compartmental_incurred",
    "reserving_compartmental_one_response",
    "reserving_compartmental_grain",
    "reserving_compartmental_subannual",
    "reserving_compartmental_gm2",
    "reserving_compartmental_segments",
]
unit-tests = "c"

[features]
# The Bayesian (NUTS) parity tests: about 220 s in a debug build and 17 s in
# release when there were six files (thirteen now, with the one-year views'
# refits, minutes in release), so a plain `cargo test` skips them and CI runs them in release
# (the `bayes` job of .github/workflows/ci.yml). Run them locally with
#   cargo test --release -p prospicio-validation --features slow-bayes \
#     --test 'reserving_bayes*' --test 'reserving_meyers*' \
#     --test 'reserving_compartmental*'
# A new Bayesian parity file gets a [[test]] entry below and a leg in
# [package.metadata.bayes-shards] above: the CI job reads both.
# The slowest arms (the Meyers and compartmental one-year views) run a
# smoke version (Meyers' CRC, compartmental model 1 without its refit
# comparison) unless RISK_RS_FULL_BAYES is set, as CI's
# weekly and manual runs set it: prefix the command above with
# RISK_RS_FULL_BAYES=1 for all of them (prospicio_validation::full_bayes).
# prospicio-reserving's own NUTS unit tests run in release with
#   cargo test --release -p prospicio-reserving --features slow-tests --lib
# `slow-bayes` turns that feature on too, so one flag covers every slow
# Bayesian test.
slow-bayes = ["prospicio-reserving/slow-tests"]

[[test]]
name = "reserving_bayes"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_bayes_bf"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_bayes_bf_normalised"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_bayes_hierarchical_bf"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_bayes_excess_prior"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_bayes_new_year"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_bayes_segments"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_meyers"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_meyers_cay"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_meyers_segments"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_compartmental"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_compartmental_incurred"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_compartmental_one_response"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_compartmental_grain"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_compartmental_subannual"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_compartmental_gm2"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_compartmental_segments"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_bayes_one_year"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_bayes_one_year_conformance"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_bayes_bf_one_year"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_bayes_one_year_moment_match"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_meyers_one_year"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_compartmental_one_year"
required-features = ["slow-bayes"]

# The 200-triangle calibration study (docs/design/reserving-calibration.md).
# The entry puts the file in CI's `bayes` job, which runs its unit tests and
# the wiring checks on group 353 (Mack, the ODP bootstrap and the six
# Bayesian arm and basis pairs of the default run, Compartmental model 1
# included, at the study's settings) and on synthetic squares (cut-down NUTS
# runs, Compartmental's too) and the pin check: 34 tests, about 2 s of wall time in release on
# 16 threads, since they run in parallel (Compartmental's group 353 check
# alone about 1.5 s). The study itself stays #[ignore]d and runs
# by hand only (the file's header): that job passes no `--include-ignored`.
# The cost: a plain `cargo test` no longer builds the file, so its unit tests
# run only in the `bayes` job, and a PR that touches only
# validation/scripts/calibration_panel.py does not trigger that job.
[[test]]
name = "reserving_calibration_meyers"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_bayes_loss_ratio_draws"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_bayes_pattern_draws"
required-features = ["slow-bayes"]

[[test]]
name = "reserving_bayes_hierarchical_bf_one_year"
required-features = ["slow-bayes"]
