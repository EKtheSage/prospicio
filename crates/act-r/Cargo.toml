[package]
name = "act-r"
description = "R bindings (extendr). Thin wrappers only: no algorithms live here."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "actuarialrs_r"
crate-type = ["staticlib"]

[dependencies]
act-core.workspace = true
act-aggregate.workspace = true
act-prob.workspace = true
act-pricing.workspace = true
# result_condition: Rust errors come back as R condition objects (raised by
# R/actuarialrs/R/distributions.R) instead of panics, so R prints no Rust
# panic message for ordinary input errors.
extendr-api = { version = "0.9.0", features = ["result_condition"] }
