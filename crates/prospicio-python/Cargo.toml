[package]
name = "prospicio-python"
description = "Python bindings (PyO3). Thin wrappers only: no algorithms live here."
version.workspace = true
edition.workspace = true
# The workspace minimum; the default `nn` feature (prospicio-nn, Burn 0.21)
# needs Rust 1.92. Kept at the workspace value so clippy lints the shared
# binding files against one minimum.
rust-version.workspace = true
publish = false
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "prospicio_native"
crate-type = ["cdylib"]

[dependencies]
prospicio-core.workspace = true
prospicio-aggregate.workspace = true
prospicio-bayes.workspace = true
prospicio-glm.workspace = true
prospicio-models.workspace = true
# Neural networks on Burn, behind the default `nn` feature.
prospicio-nn = { workspace = true, optional = true }
prospicio-prob.workspace = true
prospicio-pricing.workspace = true
# The bayes feature: BayesOdp (docs/design/reserving-bayes.md, decision 2);
# io: Triangle.read_csv and read_excel (docs/design/triangle.md, decision 6).
prospicio-reserving = { workspace = true, features = ["bayes", "io"] }
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py39", "experimental-inspect"] }

[features]
default = ["nn"]
# The CANN, the attention CANN and ONNX import (`prospicio-nn`, Burn).
nn = ["dep:prospicio-nn"]
