[package]
name = "act-python"
description = "Python bindings (PyO3). Thin wrappers only: no algorithms live here."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "actuarialrs_native"
crate-type = ["cdylib"]

[dependencies]
act-core.workspace = true
act-prob.workspace = true
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py39", "experimental-inspect"] }
