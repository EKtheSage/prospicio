[package]
name = "prospicio-wasm"
description = "JavaScript bindings (wasm-bindgen) over the WASM-scope crates. Thin wrappers only: no algorithms live here."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Shipped as an npm package built by `cargo xtask wasm`, not on crates.io.
publish = false
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "prospicio_wasm"
# cdylib is the .wasm module; rlib lets the tests under tests/ link it.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The WASM scope (docs/architecture.md): no threads, files or C on these
# crates' default features.
prospicio-core.workspace = true
prospicio-prob.workspace = true
prospicio-aggregate.workspace = true
prospicio-pricing.workspace = true
prospicio-reserving.workspace = true
# Pinned to the version of the `wasm-bindgen` command-line tool that
# `cargo xtask wasm` and CI install: the two must match exactly.
wasm-bindgen = "=0.2.129"
js-sys = "0.3.106"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"

[dev-dependencies]
wasm-bindgen-test = "0.3"
