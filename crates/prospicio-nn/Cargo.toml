[package]
name = "prospicio-nn"
description = "Neural networks on Burn behind the prospicio-models interface: CANN first (docs/design/models.md)."
version.workspace = true
edition.workspace = true
# Burn 0.21 needs Rust 1.92; this crate is opt-in, so the rest of the
# workspace keeps its lower minimum.
rust-version = "1.92"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
prospicio-core.workspace = true
prospicio-models.workspace = true
prospicio-prob.workspace = true
burn = { version = "0.21", default-features = false, features = ["std", "ndarray", "autodiff"] }
# Burn's ONNX parser (the front end of burn-import), for loading networks
# trained elsewhere at run time (`onnx` module). Pure Rust: protobuf's
# parser needs no protoc.
onnx-ir = { version = "0.21", optional = true }

[features]
default = ["onnx"]
onnx = ["dep:onnx-ir"]
