[package]
name = "prospicio-xll"
description = "Excel add-in (XLL, 64-bit Windows). Thin wrappers only: no algorithms live here."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
# One test binary, `worksheet` (#825): build.rs makes each file of tests/ a
# module of it.
autotests = false
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "prospicio_xll"
# cdylib is the .xll on Windows (a DLL renamed); rlib lets the portable
# core (`sheet`, `reserving`, `pricing`) be tested on any host with plain `cargo test`.
crate-type = ["cdylib", "rlib"]

[dependencies]
prospicio-core.workspace = true
prospicio-reserving = { workspace = true, features = ["bayes"] }
prospicio-bayes.workspace = true
prospicio-prob.workspace = true
prospicio-aggregate.workspace = true
prospicio-pricing.workspace = true
prospicio-glm.workspace = true
prospicio-models.workspace = true
prospicio-math.workspace = true

[[test]]
name = "worksheet"
path = "tests/worksheet.rs"
