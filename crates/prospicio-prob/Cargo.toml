[package]
name = "prospicio-prob"
description = "Risk mathematics: distributions, PredictiveDistribution, risk measures and distortions (later: dependence)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
prospicio-core.workspace = true
prospicio-math.workspace = true
# Provenance input hashes (InputHasher).
blake3.workspace = true
# Arrow IPC files (the `arrow` feature): format in `ipc`.
arrow-array = { workspace = true, optional = true }
arrow-ipc = { workspace = true, optional = true }
arrow-schema = { workspace = true, optional = true }
# Distributions as JSON (Dist::to_json).
serde_json.workspace = true
# Outer-loop parallelism over simulations (PredictiveDistribution::simulate).
rayon.workspace = true

[features]
# Read and write PredictiveDistribution as Arrow IPC files. Off by default:
# arrow is heavy, and WASM builds do not need it.
arrow = ["dep:arrow-array", "dep:arrow-ipc", "dep:arrow-schema"]
