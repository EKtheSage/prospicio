[package]
name = "prospicio-reserving"
description = "Reserving: triangles, Chain Ladder, Mack, Bornhuetter-Ferguson, Cape Cod, Clark, the ODP bootstrap and the one-year view."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
prospicio-core.workspace = true
prospicio-glm.workspace = true
prospicio-math.workspace = true
prospicio-models.workspace = true
prospicio-prob.workspace = true
# The Bayesian chain ladder (the `bayes` module), off by default so that the
# WASM scope does not compile nuts-rs (docs/design/reserving-bayes.md,
# decision 2).
prospicio-bayes = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
# Triangles read from CSV and Excel files (the `io` module), off by default
# so that the WASM scope reads no files (docs/design/triangle.md, decision 6).
calamine = { workspace = true, optional = true }
csv = { workspace = true, optional = true }

[features]
bayes = ["dep:prospicio-bayes", "dep:rayon"]
# `Triangle::from_csv`, `read_csv` and `read_excel` (the `io` module).
io = ["dep:csv", "dep:calamine"]
# Runs the unit tests that sample with NUTS (`bayes::*`). They are ignored
# without it: in a debug build they took about 220 s single-threaded and
# about 5 minutes of CI's 4-core `cargo test`, against seconds in release.
# CI's `bayes` job runs them with
#   cargo test --release -p prospicio-reserving --features slow-tests --lib
slow-tests = ["bayes"]

[dev-dependencies]
rayon.workspace = true
