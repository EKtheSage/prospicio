[package]
name = "prospicio-reserving"
description = "Reserving: triangles, Chain Ladder, Mack, Bornhuetter-Ferguson, Cape Cod, Clark, the ODP bootstrap and the one-year view."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
prospicio-core.workspace = true
prospicio-glm.workspace = true
prospicio-math.workspace = true
prospicio-models.workspace = true
prospicio-prob.workspace = true
# The Bayesian chain ladder (the `bayes` module), off by default so that the
# WASM scope does not compile nuts-rs (docs/design/reserving-bayes.md,
# decision 2).
prospicio-bayes = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }

[features]
bayes = ["dep:prospicio-bayes", "dep:rayon"]

[dev-dependencies]
rayon.workspace = true
