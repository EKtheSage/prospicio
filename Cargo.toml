[workspace]
members = ["crates/*", "validation", "xtask"]
# Binding crates need a Python or R toolchain at build time, so plain
# `cargo build` / `cargo test` skip them; see python/ and R/ for their builds.
default-members = [
    "crates/prospicio",
    "crates/prospicio-core",
    "crates/prospicio-math",
    "crates/prospicio-prob",
    "crates/prospicio-reserving",
    "crates/prospicio-aggregate",
    "crates/prospicio-pricing",
    "crates/prospicio-models",
    "crates/prospicio-glm",
    "crates/prospicio-bayes",
    "crates/prospicio-nn",
    "validation",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Ethan Kang <ethan.yskang@gmail.com>"]
repository = "https://github.com/EKtheSage/prospicio"
homepage = "https://ekthesage.github.io/prospicio/"
readme = "README.md"
keywords = ["actuarial", "insurance", "reserving", "reinsurance", "risk"]
categories = ["science", "mathematics", "finance"]

[workspace.dependencies]
# The version must match workspace.package.version: `cargo publish` uploads
# it in place of the path (docs/release.md).
prospicio = { version = "0.0.1", path = "crates/prospicio" }
prospicio-core = { version = "0.0.1", path = "crates/prospicio-core" }
prospicio-math = { version = "0.0.1", path = "crates/prospicio-math" }
prospicio-aggregate = { version = "0.0.1", path = "crates/prospicio-aggregate" }
prospicio-prob = { version = "0.0.1", path = "crates/prospicio-prob" }
prospicio-pricing = { version = "0.0.1", path = "crates/prospicio-pricing" }
prospicio-models = { version = "0.0.1", path = "crates/prospicio-models" }
prospicio-glm = { version = "0.0.1", path = "crates/prospicio-glm" }
prospicio-bayes = { version = "0.0.1", path = "crates/prospicio-bayes" }
prospicio-nn = { version = "0.0.1", path = "crates/prospicio-nn" }
prospicio-reserving = { version = "0.0.1", path = "crates/prospicio-reserving" }
# PredictiveDistribution to and from Arrow IPC (prospicio-prob's `arrow`
# feature). 59.x is the last line that builds on rust-version 1.85.
arrow-array = { version = "59.3.0", default-features = false }
arrow-ipc = { version = "59.3.0", default-features = false }
arrow-schema = { version = "59.3.0", default-features = false }
libm = "0.2.16"
# Linear programs in prospicio-pricing (reference fits). Pure Rust simplex, no
# C or C++ build, so CRAN, Windows and WASM builds are unaffected.
microlp = { version = "0.6.0", default-features = false }
# Provenance input hashes. `pure` skips the C/assembly SIMD build so the
# Windows R build (Rtools) and WASM need no extra toolchain.
blake3 = { version = "1.8.7", default-features = false, features = ["std", "pure"] }
# Pinned exactly: RNG output is part of the reproducibility contract, so a
# version bump must be a deliberate, reviewed change.
rand_chacha = "=0.10.0"
rand_core = "=0.10.1"
# NUTS sampler: the Rust core of nutpie (MIT).
nuts-rs = "0.19.0"
rayon = "1.12.0"
# FFT aggregation in prospicio-aggregate. Pure Rust (SIMD via intrinsics, no C), so
# it builds for the Windows R target and WASM.
rustfft = "6.4.1"
# float_roundtrip: model artifacts store estimates as JSON numbers and must
# read back bit for bit.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
