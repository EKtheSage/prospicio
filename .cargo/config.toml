[alias]
# Build tasks that span languages: `cargo xtask help`.
xtask = "run --quiet --package xtask --"

# `cargo test -p prospicio-wasm --target wasm32-unknown-unknown` runs the
# JavaScript bindings' tests under Node (docs/design/wasm.md); the runner
# comes with `cargo install wasm-bindgen-cli`.
[target.wasm32-unknown-unknown]
runner = "wasm-bindgen-test-runner"
