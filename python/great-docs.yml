# Python API site. Built by `cargo xtask python`; see docs/architecture.md,
# "Documentation". Options: https://posit-dev.github.io/great-docs/
module: actuarialrs
display_name: actuarialrs
parser: numpy
# Static analysis reads actuarialrs_native.pyi, which maturin generates from
# the Rust doc comments (`--generate-stubs`); nothing is imported.
dynamic: false
repo: https://github.com/EKtheSage/risk-rs
pypi: false
changelog:
  enabled: false
site:
  html-math-method: katex
reference:
  - title: Distributions
    desc: Parametric, discretized and sampled representations.
    contents:
      - distributions.Lognormal
      - distributions.Gamma
      - distributions.Tweedie
      - distributions.Weibull
      - distributions.Loglogistic
      - distributions.Mixture
      - distributions.Custom
      - distributions.to_json
      - distributions.from_json
      - distributions.Grid
      - distributions.DiscretizationReport
      - distributions.Sampled
  - title: Large-loss severities
    desc: The Pareto family for layer and treaty pricing, with maximum likelihood fits.
    contents:
      - distributions.Pareto
      - distributions.PiecewisePareto
      - distributions.LogAffinePareto
      - distributions.GeneralizedPareto
      - distributions.local_pareto_to_piecewise
  - title: Claim counts
    desc: Frequency distributions for frequency-severity aggregation.
    contents:
      - distributions.Poisson
      - distributions.NegativeBinomial
      - distributions.Binomial
      - distributions.claim_count
  - title: Predictive distributions
    desc: The joint result every model returns.
    contents:
      - distributions.PredictiveDistribution
  - title: Aggregate loss
    desc: Compound distributions on a grid, and simulated years of losses.
    contents:
      - aggregate.panjer
      - aggregate.fft
      - aggregate.CompoundReport
      - aggregate.simulate_events
      - aggregate.EventSet
  - title: Reinsurance
