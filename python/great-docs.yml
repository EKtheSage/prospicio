# Python API site. Built by `cargo xtask python`; see docs/architecture.md,
# "Documentation". Options: https://posit-dev.github.io/great-docs/
module: prospicio
display_name: prospicio
parser: numpy
# Static analysis reads prospicio_native.pyi, which maturin generates from
# the Rust doc comments (`--generate-stubs`); nothing is imported.
dynamic: false
repo: https://github.com/EKtheSage/prospicio
pypi: false
changelog:
  enabled: false
site:
  html-math-method: katex
# The guides (docs/guides) and the notebooks (examples/), executed, staged by
# `cargo xtask python`, which writes this directory before the build.
user_guide: ../target/user-guide
