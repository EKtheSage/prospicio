[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "actuarialrs"
description = "Actuarial modeling on a Rust core."
requires-python = ">=3.9"
dynamic = ["version"]

[dependency-groups]
dev = [
    "maturin>=1.7,<2",
    "pandas",
    "pytest",
    "scipy",
    # Engines behind actuarialrs.boosting; the CPU-only XGBoost wheel is
    # 6 MB where the full one bundles 200+ MB of GPU libraries.
    "lightgbm",
    "xgboost-cpu ; sys_platform == 'linux'",
    "xgboost ; sys_platform != 'linux'",
]
docs = [
    "great-docs>=0.17 ; python_full_version >= '3.11'",
]

[tool.maturin]
manifest-path = "../crates/act-python/Cargo.toml"
module-name = "actuarialrs.actuarialrs_native"
python-source = "."
include = [{ path = "actuarialrs/**/*", format = "sdist" }]

[tool.uv]
# Rebuild the Rust extension on `uv sync` / `uv run` when Rust sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "../Cargo.toml" },
    { file = "../Cargo.lock" },
    { file = "../crates/**/*.rs" },
    { file = "../crates/**/Cargo.toml" },
]
