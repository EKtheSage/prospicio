[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "prospicio"
description = "Actuarial and risk modeling on a Rust core: reserving, distributions, aggregate loss, reinsurance and pricing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Ethan Kang", email = "ethan.yskang@gmail.com" }]
keywords = ["actuarial", "insurance", "reserving", "reinsurance", "risk"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# The version is the Rust workspace's (Cargo.toml, workspace.package).
dynamic = ["version"]

[project.urls]
Homepage = "https://ekthesage.github.io/prospicio/"
Documentation = "https://ekthesage.github.io/prospicio/"
Repository = "https://github.com/EKtheSage/prospicio"

[dependency-groups]
dev = [
    "maturin>=1.7,<2",
    "pandas",
    "pytest",
    "scipy",
    # Engines behind prospicio.boosting; the CPU-only XGBoost wheel is
    # 6 MB where the full one bundles 200+ MB of GPU libraries.
    "lightgbm",
    "xgboost-cpu ; sys_platform == 'linux'",
    "xgboost ; sys_platform != 'linux'",
]
docs = [
    "great-docs>=0.17 ; python_full_version >= '3.11'",
]

[tool.maturin]
manifest-path = "../crates/prospicio-python/Cargo.toml"
module-name = "prospicio.prospicio_native"
python-source = "."
include = [{ path = "prospicio/**/*", format = "sdist" }]

[tool.uv]
# Rebuild the Rust extension on `uv sync` / `uv run` when Rust sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "../Cargo.toml" },
    { file = "../Cargo.lock" },
    { file = "../crates/**/*.rs" },
    { file = "../crates/**/Cargo.toml" },
]
